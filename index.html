<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #01020a; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        .bottom-bar { position: absolute; bottom: 0; width: 100%; height: 90px; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; gap: 8px; pointer-events: auto; z-index: 2000; }
        .btn { width: 45px; height: 45px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .btn.active-launch { background: #f1c40f; color: #000; box-shadow: 0 0 30px #f1c40f; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { scale: 1; } 50% { scale: 1.1; } 100% { scale: 1; } }

        /* Прицел */
        #aim-ui { position: absolute; width: 240px; height: 240px; border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 500; }
        .sector { position: absolute; width: 50%; height: 50%; left: 50%; top: 50%; transform-origin: 0 0; clip-path: polygon(0 0, 100% 0, 85% 35%, 0 0); border-top: 1px solid rgba(255,255,255,0.1); }
        .sector.highlight { background: radial-gradient(circle at 0 0, rgba(241,196,15,0.7) 0%, transparent 70%); border-top: 2px solid #f1c40f; }

        /* ГРАФИКА */
        .obj { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
        
        /* Комета */
        .comet-wrap { width: 40px; height: 30px; position: relative; }
        .comet-body { width: 100%; height: 100%; background: radial-gradient(circle at 30% 30%, #888, #222); border-radius: 45% 55% 35% 65%; box-shadow: 0 0 20px orange; position: relative; z-index: 10; }
        .comet-tail { position: absolute; width: 60px; height: 180px; background: linear-gradient(to bottom, rgba(255,165,0,0.8), rgba(255,69,0,0.4), transparent); filter: blur(10px); top: 15px; left: -10px; transform-origin: top center; }

        /* Звезды */
        .nebula { position: absolute; width: 60px; height: 60px; background: radial-gradient(circle, rgba(0,150,255,0.2), transparent 70%); transform: translate(-50%, -50%); animation: pulseNebula 4s infinite alternate; }
        .ring { position: absolute; width: 40px; height: 10px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%, -50%) rotateX(70deg); animation: rotateRing 10s infinite linear; }
        
        @keyframes rotateRing { from { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg); } to { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg); } }
        @keyframes pulseNebula { from { scale: 0.8; opacity: 0.2; } to { scale: 1.3; opacity: 0.5; } }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="bottom-bar">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 25)">$25</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet', 50)" onclick="confirmComet()">☄️</div>
        <div class="btn" style="opacity:0.1">?</div><div class="btn" style="opacity:0.1">?</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events, Vector } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 1, offsetX = 0, offsetY = 0, lastDist = 0;
        let activeDrag = null, isPanning = false, lastX = 0, lastY = 0;
        let cometPending = null;

        for(let i=0; i<16; i++) {
            let s = document.createElement('div'); s.className = 'sector';
            s.style.transform = `rotate(${i * 22.5 - 11.25}deg)`;
            document.getElementById('aim-ui').appendChild(s);
        }

        function initDrag(e, type, price) {
            const t = e.touches[0];
            activeDrag = { type, price, x: t.pageX, y: t.pageY, active: false };
            haptic('light');
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (!e.target.closest('.btn')) {
                isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0];
                if (window.innerHeight - t.pageY > 110) {
                    if(!activeDrag.active) { activeDrag.active = true; haptic('medium'); }
                    activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                }
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t1.pageX - t2.pageX, t1.pageY - t2.pageY);
                const mid = { x: (t1.pageX + t2.pageX)/2, y: (t1.pageY + t2.pageY)/2 };
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), 0.1), 30);
                offsetX -= (mid.x - offsetX) * (nextScale / scale - 1);
                offsetY -= (mid.y - offsetY) * (nextScale / scale - 1);
                scale = nextScale; lastDist = dist; updateTransform();
            } else if (isPanning) {
                offsetX += e.touches[0].pageX - lastX; offsetY += e.touches[0].pageY - lastY;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY; updateTransform();
            }
            
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                const newAngle = Math.round(Math.atan2(dy, dx) / (Math.PI/8)) * (Math.PI/8);
                if (newAngle !== cometPending.angle) { cometPending.angle = newAngle; updateSectors(newAngle); haptic('light'); }
            }
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                const wx = (activeDrag.x - offsetX) / scale;
                const wy = (activeDrag.y - offsetY) / scale;
                if (activeDrag.type === 'star') placeStar(wx, wy, activeDrag.price);
                else prepareComet(wx, wy);
            }
            activeDrag = null; isPanning = false; lastDist = 0;
        });

        function placeStar(x, y, p) {
            const b = Bodies.circle(x, y, 15, { isStatic: true, isSensor: true });
            b.price = p;
            const v = document.createElement('div'); v.className = 'obj';
            
            if (p === 10) { v.innerHTML += `<div class="nebula"></div>`; }
            if (p === 25) { v.innerHTML += `<div class="ring"></div>`; }
            if (p === 3) {
                for(let i=0; i<6; i++) {
                    let r = document.createElement('div');
                    r.style.cssText = `position:absolute;height:1px;width:25px;background:white;transform:rotate(${i*60}deg);transform-origin:left;`;
                    v.appendChild(r);
                }
            }
            const s = p === 25 ? 16 : (p === 10 ? 10 : 5);
            v.innerHTML += `<div style="width:${s}px;height:${s}px;background:#fff;border-radius:50%;box-shadow:0 0 ${s*5}px #fff;z-index:20;"></div>`;
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function prepareComet(x, y) {
            cometPending = { wx: x, wy: y, angle: 0 };
            document.getElementById('aim-ui').style.display = 'block';
            document.getElementById('comet-btn').classList.add('active-launch');
            updateTransform();
        }

        function confirmComet() {
            if (!cometPending) return;
            const b = Bodies.circle(cometPending.wx, cometPending.wy, 18, { frictionAir: 0 });
            b.isComet = true;
            const v = document.createElement('div'); v.className = 'obj';
            v.innerHTML = `<div class="comet-wrap"><div class="comet-tail"></div><div class="comet-body"></div></div>`;
            b.visual = v;
            Body.setVelocity(b, { x: Math.cos(cometPending.angle) * 0.08, y: Math.sin(cometPending.angle) * 0.08 });
            Composite.add(engine.world, b);
            document.getElementById('aim-ui').style.display = 'none';
            document.getElementById('comet-btn').classList.remove('active-launch');
            cometPending = null; haptic('heavy');
        }

        function updateSectors(angle) {
            const index = (Math.round(angle / (Math.PI/8)) + 16) % 16;
            document.querySelectorAll('.sector').forEach((s, i) => s.classList.toggle('highlight', i === index));
        }

        Events.on(engine, 'afterUpdate', () => {
            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px';
                    if(b.isComet) {
                        const rot = Math.atan2(b.velocity.y, b.velocity.x) + Math.PI/2;
                        b.visual.style.transform = `translate(-50%, -50%) rotate(${rot}rad) scale(${Math.max(1, scale/3)})`;
                    }
                }
            });
        });

        function updateTransform() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            if(cometPending) {
                const aim = document.getElementById('aim-ui');
                aim.style.left = (cometPending.wx * scale + offsetX) + 'px';
                aim.style.top = (cometPending.wy * scale + offsetY) + 'px';
            }
        }

        function haptic(s) { if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred(s); }
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
