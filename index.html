<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Ocean App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
    body {
        background: linear-gradient(-45deg, #0f172a, #1e293b, #0891b2, #1e40af);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
        color: #f8fafc;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container {
        text-align: center;
        padding: 40px;
        background: rgba(15, 23, 42, 0.6);
        border-radius: 30px;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        max-width: 80%;
    }

    h1 {
        font-size: 2.8rem;
        margin-bottom: 5px;
        letter-spacing: -1px;
    }

    #user-name {
        font-size: 1.2rem;
        color: #3b82f6;
        font-weight: bold;
        margin-bottom: 25px;
    }

    .main-button {
        background: white;
        color: #0f172a;
        border: none;
        padding: 18px 35px;
        border-radius: 15px;
        font-size: 1rem;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .main-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    </style>
    
</head>
<body>
    <div class="container">
        <h1>Liquid Ocean</h1>
        <p id="user-name">Загрузка данных...</p>
        
        <button class="main-button" onclick="checkSystem()">
            Проверить отклик
        </button>
    </div>
    <script src="app.js"></script>
</body>
</html>
