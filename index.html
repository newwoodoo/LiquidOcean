<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #010206; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1); }
        
        .ui { position: absolute; z-index: 1000; width: 100%; pointer-events: none; }
        .bottom { bottom: 20px; display: flex; justify-content: center; gap: 5px; padding: 0 10px; }
        .top-left { top: 45px; left: 20px; pointer-events: auto; }

        .btn { 
            pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; 
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }
        .toggle-filter { background: rgba(0,0,0,0.5); border: 1px solid #fff; color: #fff; padding: 6px 12px; border-radius: 15px; font-size: 11px; }

        /* Прицел кометы (увеличенный) */
        #aim-circle {
            position: absolute; width: 160px; height: 160px; border: 2px dashed rgba(241,196,15,0.4);
            border-radius: 50%; display: none; pointer-events: none; z-index: 2000;
        }
        #aim-line { position: absolute; height: 3px; background: #f1c40f; transform-origin: left center; width: 0; top: 50%; left: 50%; }

        /* Стили объектов */
        .star-core { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; pointer-events: none; }
        .ghost { opacity: 0.5 !important; border: 1px solid yellow; }
        
        .star-3-rays {
            position: absolute; width: 30px; height: 30px; transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 75%);
            filter: blur(3px); animation: pulse 3s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.3; scale: 0.7; } to { opacity: 0.8; scale: 1.3; } }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="aim-circle"><div id="aim-line"></div></div>

    <div class="ui top-left">
        <button class="toggle-filter" onclick="toggleFilter()">МОИ ЗВЕЗДЫ: ВКЛ</button>
    </div>

    <div class="ui bottom">
        <div class="btn" ontouchstart="startDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="startDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="startDrag(event, 'star', 10)">$10</div>
        <div class="btn" ontouchstart="startDrag(event, 'star', 25)">$25</div>
        <div class="btn" ontouchstart="startDrag(event, 'comet', 50)">☄️</div>
        <div class="btn" style="opacity:0.2">?</div>
        <div class="btn" style="opacity:0.2">?</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create();
        Runner.run(runner, engine);

        let scale = 1, offsetX = 0, offsetY = 0;
        let dragItem = null, isDraggingMap = false;
        let lastPinchDist = 0, lastX = 0, lastY = 0;
        let originalScale = 1;

        function startDrag(e, type, price) {
            e.preventDefault();
            const touch = e.touches[0];
            dragItem = { type, price, x: touch.pageX, y: touch.pageY, ghost: null };
            
            // Авто-зум
            originalScale = scale;
            scale = (price <= 10) ? 5 : 2; 
            updateTransform();
            
            haptic('light');
        }

        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            
            if (dragItem) {
                dragItem.x = touch.pageX; dragItem.y = touch.pageY;
                moveGhost();
                checkEdgeScroll(touch.pageX, touch.pageY);
                
                if (dragItem.type === 'comet') {
                    showAim(touch.pageX, touch.pageY);
                }
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                if (!lastPinchDist) lastPinchDist = dist;
                scale = Math.min(Math.max(scale * (dist / lastPinchDist), 0.1), 20);
                lastPinchDist = dist;
                updateTransform();
            } else if (isDraggingMap) {
                offsetX += touch.pageX - lastX;
                offsetY += touch.pageY - lastY;
                lastX = touch.pageX; lastY = touch.pageY;
                updateTransform();
            }
        });

        window.addEventListener('touchend', (e) => {
            if (dragItem) {
                const worldX = (dragItem.x - offsetX) / scale;
                const worldY = (dragItem.y - offsetY) / scale;
                
                if (dragItem.type === 'star') createStar(worldX, worldY, dragItem.price);
                else if (dragItem.type === 'comet') finishCometLaunch(worldX, worldY);
                
                // Возврат зума
                setTimeout(() => { scale = originalScale; updateTransform(); }, 800);
                
                if (dragItem.ghost) dragItem.ghost.remove();
                document.getElementById('aim-circle').style.display = 'none';
                dragItem = null;
            }
            isDraggingMap = false;
            lastPinchDist = 0;
        });

        // Навигация (свободный клик для перемещения)
        window.addEventListener('touchstart', (e) => {
            if (e.target === document.body || e.target === view) {
                isDraggingMap = true;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        function createStar(x, y, p) {
            const el = document.createElement('div');
            el.className = 'star-core';
            const s = p === 25 ? 8 : (p === 10 ? 5 : 3);
            el.style.width = s+'px'; el.style.height = s+'px';
            el.style.left = x+'px'; el.style.top = y+'px';
            if(p===3) {
                const rays = document.createElement('div'); rays.className = 'star-3-rays';
                el.appendChild(rays);
            }
            view.appendChild(el);
            haptic('medium');
        }

        function finishCometLaunch(x, y) {
            const body = Bodies.circle(x, y, 3, { frictionAir: 0 });
            const visual = document.createElement('div');
            visual.className = 'star-core';
            visual.style.background = 'orange';
            visual.innerHTML = '<div style="position:absolute;width:1px;height:50px;background:linear-gradient(to top, orange, transparent);top:0;left:50%;transform-origin:top;"></div>';
            view.appendChild(visual);
            Body.setVelocity(body, { x: 0.04, y: -0.01 }); // Медленный полет
            body.visual = visual;
            Composite.add(engine.world, body);
            haptic('heavy');
        }

        function checkEdgeScroll(x, y) {
            const edge = 60;
            if (x < edge) offsetX += 5;
            if (x > window.innerWidth - edge) offsetX -= 5;
            if (y < edge) offsetY += 5;
            if (y > window.innerHeight - edge) offsetY -= 5;
            updateTransform();
        }

        function showAim(x, y) {
            const aim = document.getElementById('aim-circle');
            aim.style.display = 'block';
            aim.style.left = (x - 80) + 'px'; aim.style.top = (y - 80) + 'px';
        }

        function moveGhost() {
            // Визуальный объект под пальцем во время переноса
        }

        function updateTransform() { view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`; }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px';
                    b.visual.style.top = b.position.y + 'px';
                }
            });
        });

        function toggleFilter() { alert("Фильтр: Показываются только ваши объекты"); }
        function haptic(s) { if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred(s); }
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
