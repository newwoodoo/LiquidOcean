<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; background: #F5F1E9; 
            overflow: hidden; touch-action: none; 
            font-family: -apple-system, system-ui, sans-serif; 
        }
        .header { 
            position: absolute; top: 50px; width: 100%; 
            display: flex; justify-content: space-around; z-index: 100; 
        }
        .btn { 
            width: 36px; height: 36px; border-radius: 50%; 
            border: 1px solid rgba(0,0,0,0.1); cursor: pointer; 
        }
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 150; 
        }
        .nickname {
            position: absolute; font-size: 16px; font-weight: 500;
            color: rgba(0, 0, 0, 0.3); transform: translateX(-50%);
            transition: all 3s ease-out; white-space: nowrap;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui-layer"></div>
    <div class="header">
        <div class="btn" style="background: #79addc;" onclick="buy('#79addc', 2.2)"></div>
        <div class="btn" style="background: #a3c586;" onclick="buy('#a3c586', 2.9)"></div>
        <div class="btn" style="background: #ffffff;" onclick="buy('#ffffff', 3.5)"></div>
        <div class="btn" style="background: #9b89b3;" onclick="buy('#9b89b3', 4.4)"></div>
    </div>
    <div id="liquid-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
        const engine = Engine.create();
        engine.timing.timeScale = 0.8;

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: { 
                width: window.innerWidth, height: window.innerHeight, 
                wireframes: false, background: 'transparent' 
            }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        const W = window.innerWidth, H = window.innerHeight, T = 1000;
        const walls = [
            Bodies.rectangle(W/2, H + T/2 - 20, W * 2, T, { isStatic: true, friction: 0.1 }),
            Bodies.rectangle(-T/2, H/2, T, H * 2, { isStatic: true }),
            Bodies.rectangle(W + T/2, H/2, T, H * 2, { isStatic: true }),
            Bodies.rectangle(W/2, -T/2, W * 2, T, { isStatic: true })
        ];
        Composite.add(engine.world, walls);

        let isShaking = false;

        function buy(color, radius) {
            const drop = Bodies.circle(W/2, H/2, radius, {
                restitution: 0.1, frictionAir: 0.02,
                render: { fillStyle: color },
                label: 'falling'
            });
            Composite.add(engine.world, drop);
            if (window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        Events.on(engine, 'beforeUpdate', () => {
            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(body => {
                if (!body.isStatic) {
                    if (body.label === 'falling') {
                        body.force.y = body.mass * 0.001;
                        body.force.x = 0;
                    } else if (isShaking) {
                        body.force.y = -body.mass * 0.005; // Летим вверх
                    }
                }
            });
        });

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                if (pair.bodyA.label === 'falling') pair.bodyA.label = 'liquid';
                if (pair.bodyB.label === 'falling') pair.bodyB.label = 'liquid';
            });
        });

        // Гироскоп
        window.addEventListener('deviceorientation', (e) => {
            if (!isShaking) {
                engine.gravity.x = (e.gamma || 0) / 50;
                engine.gravity.y = (e.beta || 0) / 50;
            }
        });

        // Встряска
        let lastX = 0, lastY = 0;
        window.addEventListener('devicemotion', (e) => {
            const acc = e.acceleration;
            if (!acc || isShaking) return;
            if (Math.abs(acc.x - lastX) > 15 || Math.abs(acc.y - lastY) > 15) {
                isShaking = true;
                showName();
                setTimeout(() => { isShaking = false; }, 5000);
            }
            lastX = acc.x; lastY = acc.y;
        });

        function showName() {
            const name = window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || "GUEST";
            const ui = document.getElementById('ui-layer');
            const el = document.createElement('div');
            el.className = 'nickname';
            el.innerText = name;
            el.style.left = '50%';
            el.style.top = '50%';
            ui.appendChild(el);
            setTimeout(() => { el.style.top = '20%'; el.style.opacity = '0'; }, 50);
            setTimeout(() => el.remove(), 3500);
        }

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        }, {once: true});

        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
