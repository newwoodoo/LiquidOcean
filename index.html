<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        .ui-panel { position: absolute; bottom: 0; width: 100%; height: 100px; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 10000; }
        .btn { width: 50px; height: 50px; border-radius: 12px; background: #333; color: #fff; display: flex; align-items: center; justify-content: center; border: 2px solid #555; }
        .btn.active-launch { border-color: #f1c40f; color: #f1c40f; }

        /* КОМЕТА - МАКСИМАЛЬНАЯ ЯРКОСТЬ */
        .comet-entity { position: absolute; width: 80px; height: 80px; pointer-events: none; z-index: 9999 !important; }
        
        /* Хвост */
        .comet-tail-v { 
            position: absolute; top: 40px; left: 30px; width: 20px; height: 300px; 
            background: #ff4500; /* Яркий сплошной цвет */
            box-shadow: 0 0 30px #ff8c00;
            border-radius: 10px; transform-origin: top center; 
        }

        /* Ядро */
        .comet-head-v {
            position: absolute; top: 40px; left: 40px; transform: translate(-50%, -50%);
            width: 30px; height: 30px; background: #fff; border-radius: 50%;
            border: 4px solid #ffae00; box-shadow: 0 0 40px 15px #fff;
        }

        .obj { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
        .star-dot { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px #fff; }

        #aim-ui { position: absolute; width: 280px; height: 280px; border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 5000; border: 2px solid gold; }
        .sector { position: absolute; width: 50%; height: 50%; left: 50%; top: 50%; transform-origin: 0 0; clip-path: polygon(0 0, 100% 0, 85% 35%, 0 0); border-top: 1px solid rgba(255,255,255,0.3); }
        .sector.highlight { background: rgba(255, 215, 0, 0.7); }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="ui-panel">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet', 50)" onclick="confirmLaunch()">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events, Vector } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        // Лимиты зума: от 0.1 до 0.7
        let scale = 0.5, offsetX = 0, offsetY = 0, lastDist = 0;
        let activeDrag = null, isPanning = false, lastX = 0, lastY = 0;
        let cometPending = null;

        const aimUI = document.getElementById('aim-ui');
        for(let i=0; i<16; i++) {
            let s = document.createElement('div'); s.className = 'sector';
            s.style.transform = `rotate(${i * 22.5 - 11.25}deg)`; aimUI.appendChild(s);
        }

        function initDrag(e, type, price) {
            activeDrag = { type, price, x: e.touches[0].pageX, y: e.touches[0].pageY, active: false };
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (!e.target.closest('.ui-panel')) {
                isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0];
                if (window.innerHeight - t.pageY > 110) {
                    activeDrag.active = true;
                    activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                }
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const mid = { x: (e.touches[0].pageX + e.touches[1].pageX)/2, y: (e.touches[0].pageY + e.touches[1].pageY)/2 };
                
                // ОГРАНИЧЕНИЕ ЗУМА ДО 0.7
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), 0.1), 0.7);
                
                offsetX -= (mid.x - offsetX) * (nextScale / scale - 1);
                offsetY -= (mid.y - offsetY) * (nextScale / scale - 1);
                scale = nextScale; lastDist = dist; updateTransform();
            } else if (isPanning) {
                offsetX += e.touches[0].pageX - lastX; offsetY += e.touches[0].pageY - lastY;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY; updateTransform();
            }
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                cometPending.angle = Math.round(Math.atan2(dy, dx) / (Math.PI/8)) * (Math.PI/8);
                updateSectors(cometPending.angle);
            }
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                const wx = (activeDrag.x - offsetX) / scale;
                const wy = (activeDrag.y - offsetY) / scale;
                if (activeDrag.type === 'star') placeStar(wx, wy);
                else prepareComet(wx, wy);
            }
            activeDrag = null; isPanning = false; lastDist = 0;
        });

        function placeStar(x, y) {
            const b = Bodies.circle(x, y, 20, { isStatic: true });
            const v = document.createElement('div'); v.className = 'obj star-dot';
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function prepareComet(x, y) {
            cometPending = { wx: x, wy: y, angle: 0 };
            aimUI.style.display = 'block';
            document.getElementById('comet-btn').classList.add('active-launch');
            updateTransform();
        }

        function confirmLaunch() {
            if (!cometPending) return;
            // Увеличил физическое тело для лучшего обнаружения
            const b = Bodies.circle(cometPending.wx, cometPending.wy, 40, { frictionAir: 0 });
            b.isComet = true;
            const v = document.createElement('div'); v.className = 'comet-entity';
            v.innerHTML = `<div class="comet-tail-v"></div><div class="comet-head-v"></div>`;
            b.visual = v;
            Body.setVelocity(b, { x: Math.cos(cometPending.angle) * 0.15, y: Math.sin(cometPending.angle) * 0.15 });
            Composite.add(engine.world, b);
            aimUI.style.display = 'none';
            document.getElementById('comet-btn').classList.remove('active-launch');
            cometPending = null;
        }

        function updateSectors(angle) {
            const index = (Math.round(angle / (Math.PI/8)) + 16) % 16;
            document.querySelectorAll('.sector').forEach((s, i) => s.classList.toggle('highlight', i === index));
        }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px';
                    if(b.isComet) {
                        const rot = Math.atan2(b.velocity.y, b.velocity.x) + Math.PI/2;
                        b.visual.style.transform = `translate(-50%, -50%) rotate(${rot}rad)`;
                    }
                }
            });
        });

        function updateTransform() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            if(cometPending) {
                aimUI.style.left = (cometPending.wx * scale + offsetX) + 'px';
                aimUI.style.top = (cometPending.wy * scale + offsetY) + 'px';
            }
        }
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
