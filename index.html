<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #02040a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #space { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Кнопки выбора типа объекта */
        .shop { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 1000; }
        .item { 
            width: 50px; height: 50px; border-radius: 12px; background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.2); color: white; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; font-size: 10px; cursor: pointer;
        }
        .item.active { border-color: #f1c40f; background: rgba(241,196,15,0.1); }

        /* Стиль звезды */
        .star-glow {
            position: absolute; border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 15px 2px white;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }

        .ui-top { position: absolute; top: 50px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 1000; }
        .comet-count { color: #f1c40f; font-weight: bold; font-size: 14px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; border: 1px solid #f1c40f; }
    </style>
</head>
<body>
    <div id="space" onclick="handleClick(event)"></div>
    
    <div class="ui-top">
        <div class="comet-count" id="c-count">КОМЕТЫ: 0</div>
        <button onclick="toggleFilter()" style="background:none; border:1px solid white; color:white; border-radius:15px; padding:5px 10px;">МОИ / ВСЕ</button>
    </div>

    <div class="shop">
        <div class="item active" id="type-star" onclick="setType('star')">⭐<br>$1-25</div>
        <div class="item" id="type-comet" onclick="setType('comet')">☄️<br>$50</div>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const W = window.innerWidth, H = window.innerHeight;
        const runner = Runner.create();
        Runner.run(runner, engine);

        let currentType = 'star';
        let cometInventory = 0;
        let myStars = [];

        function setType(t) {
            currentType = t;
            document.getElementById('type-star').classList.toggle('active', t === 'star');
            document.getElementById('type-comet').classList.toggle('active', t === 'comet');
        }

        function handleClick(e) {
            const x = e.clientX;
            const y = e.clientY;

            if (currentType === 'star') {
                createStar(x, y);
            } else if (currentType === 'comet') {
                // Если кликнули "Кометой", мы либо покупаем её, либо запускаем
                cometInventory++;
                updateUI();
                startComet(x, y);
            }
        }

        function createStar(x, y) {
            const star = Bodies.circle(x, y, 4, {
                isStatic: true, // Звезды стоят на месте
                render: { fillStyle: '#ffffff', shadowBlur: 20, shadowColor: '#ffffff' }
            });
            
            // Визуальный эффект сияния (DOM элемент поверх физики)
            const glow = document.createElement('div');
            glow.className = 'star-glow';
            glow.style.left = (x - 4) + 'px';
            glow.style.top = (y - 4) + 'px';
            glow.style.width = '8px';
            glow.style.height = '8px';
            document.getElementById('space').appendChild(glow);
            
            Composite.add(engine.world, star);
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        function startComet(x, y) {
            // Комета создается с ОЧЕНЬ маленькой скоростью
            const comet = Bodies.circle(x, y, 3, {
                frictionAir: 0,
                render: { fillStyle: '#fff', shadowBlur: 25, shadowColor: '#f1c40f' }
            });
            
            // Направление: летит медленно вправо-вверх (можно менять)
            Body.setVelocity(comet, { x: 0.05, y: -0.02 }); 
            Composite.add(engine.world, comet);
            
            // Хвост кометы (простой визуальный эффект)
            const tail = document.createElement('div');
            tail.style.position = 'absolute';
            tail.style.width = '2px'; tail.style.height = '100px';
            tail.style.background = 'linear-gradient(to bottom, transparent, rgba(241,196,15,0.4))';
            // В реальном времени хвост нужно обновлять, здесь упростим для стабильности кода
        }

        function updateUI() {
            document.getElementById('c-count').innerText = `КОМЕТЫ: ${cometInventory}`;
        }

        function toggleFilter() {
            // Логика фильтрации будет здесь (нужен сервер для других пользователей)
            alert("Сейчас показаны только ваши объекты.");
        }

        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
