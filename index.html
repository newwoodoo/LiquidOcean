<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Ocean Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #1e40af, #0f172a);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            color: #ffffff;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 35px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 85%;
            max-width: 400px;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        #user-name {
            font-size: 18px;
            color: #60a5fa;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .primary-btn {
            background: #ffffff;
            color: #000000;
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">System Online</div>
        <h1>Liquid Ocean</h1>
        <div id="user-name">Загрузка...</div>
        
        <div class="btn-group">
            <button class="primary-btn" onclick="sendData()">Отправить сигнал боту</button>
            <button class="secondary-btn" onclick="tg.close()">Закрыть панель</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Установка имени
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById("user-name").innerText = `Привет, ${user.first_name}!`;
        } else {
            document.getElementById("user-name").innerText = "Привет, Капитан!";
        }

        // Настройка главной кнопки TG
        tg.MainButton.setText("ПОДТВЕРДИТЬ");
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            tg.HapticFeedback.notificationOccurred('success');
            tg.close();
        });

        // Функция отправки данных боту
        function sendData() {
            tg.HapticFeedback.impactOccurred('heavy');
            // Это отправит сообщение боту и закроет приложение
            tg.sendData("Action: check_in");
        }
    </script>
</body>
</html>
