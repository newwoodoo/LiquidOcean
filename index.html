<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        #ui-top { position: absolute; top: 20px; left: 20px; z-index: 10000; }
        #zoom-bar { width: 100px; height: 4px; background: rgba(255,255,255,0.1); margin-bottom: 8px; border-radius: 2px; position: relative; overflow: hidden; }
        #zoom-indicator { position: absolute; height: 100%; background: #f1c40f; left: 50%; width: 0%; transform: translateX(-50%); }
        #minimap { width: 80px; height: 80px; background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 4px; position: relative; }
        #minimap-point { position: absolute; width: 4px; height: 4px; background: #ff0; border-radius: 50%; transform: translate(-50%, -50%); }

        .ui-panel { position: absolute; bottom: 0; width: 100%; height: 100px; background: #111; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10001; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
        .btn { width: 55px; height: 55px; border-radius: 15px; background: #222; border: 1px solid #444; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

        .obj { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; }
        
        /* Звезда $3 */
        .ray-long { position: absolute; top: 50%; left: 50%; width: 2px; background: linear-gradient(to top, #fff, transparent); transform-origin: 50% 100%; animation: rayAnim 2s infinite alternate; }
        @keyframes rayAnim { from { height: 20px; opacity: 0.3; } to { height: 60px; opacity: 0.7; } }
        .far-ray { position: absolute; top: 50%; left: 50%; width: 3px; height: 100px; transform-origin: 50% 100%; filter: blur(2px); }

        /* Звезда $10 */
        .belt-wrap { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; transform: translate(-50%, -50%) rotateX(75deg); }
        .ast-heavy { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; }
        .belt-static { position: absolute; width: 220%; height: 220%; border: 1px solid rgba(255,255,255,0.15); border-radius: 50%; top: -60%; left: -60%; }

        /* Прицел */
        #aim-ui { position: absolute; width: 160px; height: 160px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 50%; display: none; }
        .sec { position: absolute; width: 50%; height: 50%; left: 50%; top: 50%; transform-origin: 0 0; clip-path: polygon(0 0, 100% 0, 85% 35%, 0 0); }
        .sec.act { background: rgba(241,196,15,0.6); }
    </style>
</head>
<body>
    <div id="ui-top">
        <div id="zoom-bar"><div id="zoom-indicator"></div></div>
        <div id="minimap"><div id="minimap-point"></div></div>
    </div>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="ui-panel">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet')" onclick="confirmLaunch()">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 0.2, offsetX = window.innerWidth/2, offsetY = window.innerHeight/2;
        let lastDist = 0, activeDrag = null, isPanning = false, lastX = 0, lastY = 0, cometPending = null;

        const colors1 = ['#fff', '#aef', '#f9f', '#9f9', '#ff9', '#f96', '#acf'];

        // Прицел
        for(let i=0; i<16; i++) {
            let s = document.createElement('div'); s.className = 'sec';
            s.style.transform = `rotate(${i * 22.5 - 11.25}deg)`;
            document.getElementById('aim-ui').appendChild(s);
        }

        function initDrag(e, type, price) {
            e.stopPropagation();
            activeDrag = { type, price, x: e.touches[0].pageX, y: e.touches[0].pageY, active: false };
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            else if (!e.target.closest('.ui-panel')) { isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY; }
        });

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0]; activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                if (window.innerHeight - t.pageY > 120) activeDrag.active = true;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), 0.05), 0.8);
                const midX = (e.touches[0].pageX + e.touches[1].pageX) / 2, midY = (e.touches[0].pageY + e.touches[1].pageY) / 2;
                offsetX = midX - (midX - offsetX) * (nextScale / scale);
                offsetY = midY - (midY - offsetY) * (nextScale / scale);
                scale = nextScale; lastDist = dist;
                updateTransform();
            } else if (isPanning) {
                offsetX += (e.touches[0].pageX - lastX) * 0.8;
                offsetY += (e.touches[0].pageY - lastY) * 0.8;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                updateTransform();
            }
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                cometPending.angle = Math.atan2(dy, dx);
                const idx = (Math.round((cometPending.angle * 180 / Math.PI) / 22.5) + 16) % 16;
                document.querySelectorAll('.sec').forEach((s, i) => s.classList.toggle('act', i === idx));
            }
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) placeStar((activeDrag.x-offsetX)/scale, (activeDrag.y-offsetY)/scale, activeDrag.price);
            activeDrag = null; isPanning = false;
        });

        function placeStar(x, y, p) {
            const size = p === 1 ? 12 : (p === 3 ? 24 : 50);
            const b = Bodies.circle(x, y, size/2, { isStatic: true, label: 'star', price: p });
            const v = document.createElement('div'); v.className = 'obj p-'+p;
            v.style.width = size+'px'; v.style.height = size+'px';
            v.style.background = '#fff';

            if (p === 1) {
                v.style.boxShadow = `0 0 10px ${colors1[Math.floor(Math.random()*7)]}`;
            } else if (p === 3) {
                v.innerHTML = '<div class="rays-wrap"></div>';
                const wrap = v.querySelector('.rays-wrap');
                for(let i=0; i<8; i++) {
                    let r = document.createElement('div'); r.className = 'ray-long';
                    r.style.transform = `translate(-50%, -100%) rotate(${i*45}deg)`;
                    wrap.appendChild(r);
                }
                const far = ['#ff0', '#0ff', '#f0f'];
                far.forEach((c, i) => {
                    let fr = document.createElement('div'); fr.className = 'far-ray';
                    fr.style.background = `linear-gradient(to top, ${c}, transparent)`;
                    fr.style.transform = `translate(-50%, -100%) rotate(${i*120}deg)`;
                    v.appendChild(fr);
                });
            } else if (p === 10) {
                let w = document.createElement('div'); w.className = 'belt-wrap';
                for(let i=0; i<80; i++) {
                    let a = document.createElement('div'); a.className = 'ast-heavy';
                    let ang = i * 0.08; let rad = 50 + Math.random()*10;
                    a.style.left = 50 + rad * Math.cos(ang) + '%';
                    a.style.top = 50 + rad * Math.sin(ang) + '%';
                    w.appendChild(a);
                }
                v.appendChild(w); v.appendChild(document.createElement('div')).className = 'belt-static';
            }
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function confirmLaunch() {
            if (!cometPending) return;
            const b = Bodies.circle(cometPending.wx, cometPending.wy, 6, { frictionAir: 0 });
            const v = document.createElement('div'); v.className = 'obj';
            v.style.width = '10px'; v.style.height = '10px'; v.style.background = '#0ff';
            v.style.boxShadow = '0 0 15px #0ff';
            b.visual = v; view.appendChild(v);
            Body.setVelocity(b, { x: Math.cos(cometPending.angle)*5, y: Math.sin(cometPending.angle)*5 });
            Composite.add(engine.world, b);
            document.getElementById('aim-ui').style.display = 'none'; cometPending = null;
        }

        function updateTransform() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            document.getElementById('zoom-indicator').style.width = ((scale - 0.05) / 0.75) * 100 + '%';
            
            // Мини-карта
            document.getElementById('minimap-point').style.left = 50 - (offsetX - window.innerWidth/2)/200 + '%';
            document.getElementById('minimap-point').style.top = 50 - (offsetY - window.innerHeight/2)/200 + '%';

            // Динамика объектов
            document.querySelectorAll('.p-3').forEach(el => {
                el.querySelector('.rays-wrap').style.display = scale > 0.3 ? 'block' : 'none';
                el.querySelectorAll('.far-ray').forEach(r => {
                    r.style.display = scale <= 0.3 ? 'block' : 'none';
                    r.style.opacity = (0.3 - scale) * 3;
                });
                el.style.animation = scale < 0.2 ? 'starBlink 0.5s infinite alternate' : 'none';
            });

            document.querySelectorAll('.p-10').forEach(el => {
                const heavy = el.querySelector('.belt-wrap');
                const line = el.querySelector('.belt-static');
                heavy.style.display = scale > 0.4 ? 'block' : 'none';
                if (scale > 0.4) heavy.style.animation = 'rotateBelt 10s linear infinite';
                line.style.display = scale <= 0.4 ? 'block' : 'none';
                line.style.borderWidth = scale < 0.15 ? '1px' : '4px';
            });
        }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px';
                }
            });
        });

        updateTransform();
    </script>
</body>
</html>
