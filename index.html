<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        .ui-panel { position: absolute; bottom: 0; width: 100%; height: 100px; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 9999; }
        .btn { width: 50px; height: 50px; border-radius: 12px; background: #222; border: 2px solid #444; color: #fff; display: flex; align-items: center; justify-content: center; }
        .btn.active-launch { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f; color: #f1c40f; }

        /* Прицел */
        #aim-ui { position: absolute; width: 280px; height: 280px; border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 5000; border: 2px solid rgba(255,215,0,0.3); }
        .sector { position: absolute; width: 50%; height: 50%; left: 50%; top: 50%; transform-origin: 0 0; clip-path: polygon(0 0, 100% 0, 85% 38%, 0 0); border-top: 1px solid rgba(255,255,255,0.3); }
        .sector.highlight { background: rgba(255, 215, 0, 0.6); border-top: 3px solid #ffd700; }

        /* ГРАФИКА КОМЕТЫ (Максимальная видимость) */
        .comet-container { position: absolute; width: 60px; height: 60px; pointer-events: none; z-index: 8000 !important; }
        
        /* Хвост - теперь это длинный яркий клин */
        .comet-tail-new { 
            position: absolute; top: 30px; left: 15px; width: 30px; height: 250px; 
            background: linear-gradient(to bottom, #ffaa00 0%, #ff4400 40%, transparent 100%);
            border-radius: 50% 50% 0 0; transform-origin: top center; opacity: 0.9;
        }

        /* Щит спереди */
        .comet-shield {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 25px; border-top: 4px solid #fff; border-radius: 50% 50% 0 0;
            box-shadow: 0 -10px 20px #ffaa00; opacity: 0.8;
        }

        /* Само ядро - яркая белая точка */
        .comet-core-new {
            position: absolute; top: 25px; left: 50%; transform: translate(-50%, -50%);
            width: 18px; height: 18px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 30px 10px #fff, 0 0 60px 20px #ff4400;
        }

        .obj { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
        .star-spike { 
            position: absolute; top: 50%; left: 50%; width: 35px; height: 10px; 
            background: linear-gradient(90deg, #fff, transparent); clip-path: polygon(0% 50%, 100% 0%, 100% 100%);
            transform-origin: left center; filter: blur(var(--spike-blur, 1px));
        }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="ui-panel">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet', 50)" onclick="confirmLaunch()">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events, Vector } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 1, offsetX = 0, offsetY = 0, lastDist = 0;
        let activeDrag = null, isPanning = false, lastX = 0, lastY = 0;
        let cometPending = null;

        // Сектора
        const aimUI = document.getElementById('aim-ui');
        for(let i=0; i<16; i++) {
            let s = document.createElement('div'); s.className = 'sector';
            s.style.transform = `rotate(${i * 22.5 - 11.25}deg)`; aimUI.appendChild(s);
        }

        function initDrag(e, type, price) {
            const t = e.touches[0];
            activeDrag = { type, price, x: t.pageX, y: t.pageY, active: false };
            haptic('light');
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (!e.target.closest('.ui-panel')) {
                isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0];
                if (window.innerHeight - t.pageY > 110) {
                    if(!activeDrag.active) { activeDrag.active = true; scale = 3; updateTransform(); }
                    activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                }
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t1.pageX - t2.pageX, t1.pageY - t2.pageY);
                const mid = { x: (t1.pageX + t2.pageX)/2, y: (t1.pageY + t2.pageY)/2 };
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), 0.1), 30);
                offsetX -= (mid.x - offsetX) * (nextScale / scale - 1);
                offsetY -= (mid.y - offsetY) * (nextScale / scale - 1);
                scale = nextScale; lastDist = dist; updateTransform();
            } else if (isPanning) {
                offsetX += e.touches[0].pageX - lastX; offsetY += e.touches[0].pageY - lastY;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY; updateTransform();
            }
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                cometPending.angle = Math.round(Math.atan2(dy, dx) / (Math.PI/8)) * (Math.PI/8);
                updateSectors(cometPending.angle);
            }
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                const wx = (activeDrag.x - offsetX) / scale;
                const wy = (activeDrag.y - offsetY) / scale;
                if (activeDrag.type === 'star') placeStar(wx, wy, activeDrag.price);
                else prepareComet(wx, wy);
            }
            activeDrag = null; isPanning = false; lastDist = 0;
        });

        function placeStar(x, y, p) {
            const b = Bodies.circle(x, y, 10, { isStatic: true, isSensor: true });
            b.price = p;
            const v = document.createElement('div'); v.className = 'obj';
            if (p === 3) {
                for(let i=0; i<8; i++) {
                    let s = document.createElement('div'); s.className = 'star-spike';
                    s.style.transform = `rotate(${i*45}deg)`; v.appendChild(s);
                }
            }
            v.innerHTML += `<div style="width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:0 0 20px #fff;"></div>`;
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function prepareComet(x, y) {
            cometPending = { wx: x, wy: y, angle: 0 };
            aimUI.style.display = 'block';
            document.getElementById('comet-btn').classList.add('active-launch');
            updateTransform();
        }

        function confirmLaunch() {
            if (!cometPending) return;
            const b = Bodies.circle(cometPending.wx, cometPending.wy, 20, { frictionAir: 0 });
            b.isComet = true;
            const v = document.createElement('div'); v.className = 'comet-container';
            v.innerHTML = `<div class="comet-tail-new"></div><div class="comet-shield"></div><div class="comet-core-new"></div>`;
            b.visual = v;
            Body.setVelocity(b, { x: Math.cos(cometPending.angle) * 0.1, y: Math.sin(cometPending.angle) * 0.1 });
            Composite.add(engine.world, b);
            aimUI.style.display = 'none';
            document.getElementById('comet-btn').classList.remove('active-launch');
            cometPending = null; haptic('heavy');
        }

        function updateSectors(angle) {
            const index = (Math.round(angle / (Math.PI/8)) + 16) % 16;
            document.querySelectorAll('.sector').forEach((s, i) => s.classList.toggle('highlight', i === index));
        }

        Events.on(engine, 'afterUpdate', () => {
            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px';
                    if(b.isComet) {
                        const rot = Math.atan2(b.velocity.y, b.velocity.x) + Math.PI/2;
                        // Комета НЕ уменьшается слишком сильно
                        const visualScale = Math.max(1, scale / 3);
                        b.visual.style.transform = `translate(-50%, -50%) rotate(${rot}rad) scale(${visualScale})`;
                    }
                }
            });
        });

        function updateTransform() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            if(cometPending) {
                aimUI.style.left = (cometPending.wx * scale + offsetX) + 'px';
                aimUI.style.top = (cometPending.wy * scale + offsetY) + 'px';
            }
        }

        function haptic(s) { if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred(s); }
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
