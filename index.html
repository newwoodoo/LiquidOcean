<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10000; }
        #zoom-bar { width: 100px; height: 6px; background: rgba(255,255,255,0.1); margin-bottom: 8px; border-radius: 3px; position: relative; overflow: hidden; border: 1px solid #333; }
        #zoom-indicator { position: absolute; height: 100%; background: #f1c40f; left: 50%; width: 0%; transform: translateX(-50%); }
        
        #minimap { width: 90px; height: 90px; background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 4px; position: relative; overflow: hidden; pointer-events: auto; }
        #minimap-point { position: absolute; width: 6px; height: 6px; background: #ff0; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #ff0; pointer-events: none; }

        .ui-panel { position: absolute; bottom: 0; width: 100%; height: 100px; background: #111; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10001; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
        .btn { width: 55px; height: 55px; border-radius: 15px; background: #222; border: 1px solid #444; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

        .obj { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; }
        .ray { position: absolute; top: 50%; left: 50%; width: 2px; background: linear-gradient(to top, #fff, transparent); transform-origin: 50% 100%; animation: rayPulse 1.5s infinite alternate; }
        @keyframes rayPulse { from { opacity: 0.2; height: 30px; } to { opacity: 0.6; height: 50px; } }

        .comet-v { position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; z-index: 999; }
        .comet-shield { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 32px; height: 14px; border-radius: 32px 32px 0 0; background: radial-gradient(ellipse at bottom, rgba(255,255,255,0.5), transparent 80%); }
        .comet-tail { position: absolute; top: 2px; left: 50%; width: 32px; height: 150px; background: linear-gradient(to bottom, var(--c), transparent); clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); transform: translateX(-50%); opacity: 0.6; }

        #aim-ui { position: absolute; width: 160px; height: 160px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 5000; }
    </style>
</head>
<body>
    <div id="ui-container">
        <div id="zoom-bar"><div id="zoom-indicator"></div></div>
        <div id="minimap" onclick="teleport(event)">
            <div id="minimap-point"></div>
        </div>
    </div>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="ui-panel">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet')" onclick="confirmLaunch()">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        const WORLD_SIZE = 10000; // Огромная карта
        let scale = 0.2, offsetX = window.innerWidth/2, offsetY = window.innerHeight/2;
        let lastDist = 0, activeDrag = null, isPanning = false, lastX = 0, lastY = 0, cometPending = null;

        const MIN_ZOOM = 0.05, MAX_ZOOM = 0.5;
        const PAN_SPEED_SLOW = 0.00001; // Сверхмедленное перемещение камеры (24 часа)

        function teleport(e) {
            const rect = document.getElementById('minimap').getBoundingClientRect();
            const px = (e.clientX - rect.left) / rect.width;
            const py = (e.clientY - rect.top) / rect.height;
            offsetX = (window.innerWidth / 2) - (px - 0.5) * WORLD_SIZE * scale;
            offsetY = (window.innerHeight / 2) - (py - 0.5) * WORLD_SIZE * scale;
            updateTransform();
        }

        function initDrag(e, type, price) {
            e.stopPropagation();
            activeDrag = { type, price, x: e.touches[0].pageX, y: e.touches[0].pageY, active: false };
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (!e.target.closest('.ui-panel') && !e.target.closest('#minimap')) {
                isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0]; activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                if (window.innerHeight - t.pageY > 120) activeDrag.active = true;
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t1.pageX - t2.pageX, t1.pageY - t2.pageY);
                const midX = (t1.pageX + t2.pageX) / 2, midY = (t1.pageY + t2.pageY) / 2;
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), MIN_ZOOM), MAX_ZOOM);
                
                // Зум без убегания неба
                offsetX = midX - (midX - offsetX) * (nextScale / scale);
                offsetY = midY - (midY - offsetY) * (nextScale / scale);
                
                scale = nextScale; lastDist = dist;
                updateTransform();
            } else if (isPanning) {
                // Сверхмедленное перемещение
                offsetX += (e.touches[0].pageX - lastX) * PAN_SPEED_SLOW;
                offsetY += (e.touches[0].pageY - lastY) * PAN_SPEED_SLOW;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                updateTransform();
            }
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                cometPending.angle = Math.atan2(dy, dx);
            }
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                placeStar((activeDrag.x - offsetX) / scale, (activeDrag.y - offsetY) / scale, activeDrag.price);
            }
            activeDrag = null; isPanning = false;
        });

        function placeStar(x, y, p) {
            const size = p === 1 ? 15 : (p === 3 ? 25 : 45);
            const b = Bodies.circle(x, y, size/2, { isStatic: true, label: 'star', price: p });
            const v = document.createElement('div'); v.className = 'obj';
            v.style.width = size+'px'; v.style.height = size+'px';
            v.style.background = '#fff'; v.style.boxShadow = `0 0 ${size/2}px #fff`;
            if (p === 3) {
                for(let i=0; i<8; i++) {
                    let r = document.createElement('div'); r.className = 'ray';
                    r.style.transform = `translate(-50%, -100%) rotate(${i*45}deg)`;
                    v.appendChild(r);
                }
            }
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function confirmLaunch() {
            // Комета запускается в центр экрана для примера
            const b = Bodies.circle((window.innerWidth/2 - offsetX)/scale, (window.innerHeight/2 - offsetY)/scale, 8, { frictionAir: 0, restitution: 0.9, label: 'comet' });
            const v = document.createElement('div'); v.className = 'comet-v';
            v.style.boxShadow = `0 0 15px #f1c40f`;
            v.innerHTML = `<div class="comet-shield"></div><div class="comet-tail" style="--c:#f1c40f"></div>`;
            b.visual = v; view.appendChild(v);
            Body.setVelocity(b, { x: 0.005, y: 0.005 }); // Пролет за 24 часа
            Composite.add(engine.world, b);
        }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px';
                    if (b.label === 'comet') {
                        const rot = Math.atan2(b.velocity.y, b.velocity.x) + Math.PI/2;
                        b.visual.style.transform = `translate(-50%, -50%) rotate(${rot}rad)`;
                    }
                }
            });
        });

        function updateTransform() {
            // Ограничение камеры миром
            const margin = (WORLD_SIZE * scale) / 2;
            offsetX = Math.min(window.innerWidth/2 + margin, Math.max(window.innerWidth/2 - margin, offsetX));
            offsetY = Math.min(window.innerHeight/2 + margin, Math.max(window.innerHeight/2 - margin, offsetY));

            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            
            // Зум-индикатор из центра
            const zPct = ((scale - MIN_ZOOM) / (MAX_ZOOM - MIN_ZOOM)) * 100;
            document.getElementById('zoom-indicator').style.width = zPct + '%';
            
            // Мини-карта: ровно по краям
            let mX = 50 + (offsetX - window.innerWidth/2) / (WORLD_SIZE * scale) * 100;
            let mY = 50 + (offsetY - window.innerHeight/2) / (WORLD_SIZE * scale) * 100;
            document.getElementById('minimap-point').style.left = Math.max(0, Math.min(100, 100-mX)) + '%';
            document.getElementById('minimap-point').style.top = Math.max(0, Math.min(100, 100-mY)) + '%';
        }

        updateTransform();
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
