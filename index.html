<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* Темный премиальный фон для максимальной видимости */
            background: #1a1a1a; 
            overflow: hidden; touch-action: none; 
            font-family: -apple-system, system-ui, sans-serif; 
        }
        .header { 
            position: absolute; top: 50px; width: 100%; 
            display: flex; justify-content: space-around; z-index: 100; 
        }
        .btn { 
            width: 40px; height: 40px; border-radius: 50%; 
            border: 2px solid rgba(255,255,255,0.2); cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; }
        .nickname {
            position: absolute; font-size: 20px; font-weight: 600;
            color: #e8e2d4; transform: translateX(-50%);
            transition: all 4s ease-in-out; white-space: nowrap;
            letter-spacing: 2px; text-shadow: 0 0 10px rgba(232,226,212,0.3);
        }
    </style>
</head>
<body>
    <div id="ui-layer"></div>
    <div class="header">
        <div class="btn" style="background: #3498db;" onclick="buy('#3498db', 2.8)"></div>
        <div class="btn" style="background: #2ecc71;" onclick="buy('#2ecc71', 3.5)"></div>
        <div class="btn" style="background: #f1c40f;" onclick="buy('#f1c40f', 4.2)"></div>
        <div class="btn" style="background: #9b59b6;" onclick="buy('#9b59b6', 5.5)"></div>
    </div>
    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
        const engine = Engine.create();
        const W = window.innerWidth, H = window.innerHeight, T = 1000;
        let state = 'normal', gyroX = 0, gyroY = 1;

        const render = Render.create({
            element: document.body, engine: engine,
            options: { 
                width: W, height: H, wireframes: false, 
                background: 'transparent', pixelRatio: window.devicePixelRatio 
            }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        const walls = [
            Bodies.rectangle(W/2, H + T/2 - 20, W * 2, T, { isStatic: true, friction: 0.1 }),
            Bodies.rectangle(-T/2, H/2, T, H * 2, { isStatic: true }),
            Bodies.rectangle(W + T/2, H/2, T, H * 2, { isStatic: true })
        ];
        Composite.add(engine.world, walls);

        const limitY = H * 0.22; 

        function buy(color, radius) {
            const drop = Bodies.circle(W/2, H/2 - 50, radius, {
                restitution: 0.2, frictionAir: 0.05,
                render: { 
                    fillStyle: color,
                    strokeStyle: '#ffffff', // Белая тонкая обводка для четкости на темном
                    lineWidth: 0.5
                }, 
                isMine: true, label: 'new'
            });
            Composite.add(engine.world, drop);
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        }

        Events.on(engine, 'beforeUpdate', () => {
            Composite.allBodies(engine.world).forEach(body => {
                if (body.isStatic) return;
                if (body.label === 'new') Body.setVelocity(body, { x: 0, y: body.velocity.y });
                if (body.isMine) {
                    if (state === 'rising') {
                        const dy = limitY - body.position.y;
                        Body.setVelocity(body, { x: 0, y: dy * 0.07 });
                    } else if (state === 'floating') {
                        Body.setVelocity(body, { x: 0, y: 0 });
                        Body.setPosition(body, { x: body.position.x, y: limitY });
                    }
                }
            });
            if (state === 'normal' || state === 'falling') {
                engine.gravity.x = gyroX; engine.gravity.y = state === 'falling' ? 1.8 : gyroY;
            } else {
                engine.gravity.x = 0; engine.gravity.y = 0;
            }
        });

        Events.on(engine, 'collisionStart', (e) => {
            e.pairs.forEach(p => {
                if (p.bodyA.label === 'new') p.bodyA.label = 'liquid';
                if (p.bodyB.label === 'new') p.bodyB.label = 'liquid';
            });
        });

        window.addEventListener('deviceorientation', (e) => {
            gyroX = (e.gamma || 0) / 45; gyroY = (e.beta || 0) / 45;
        });

        window.addEventListener('devicemotion', (e) => {
            const acc = e.acceleration;
            if (!acc || state !== 'normal') return;
            if (Math.abs(acc.x) + Math.abs(acc.y) > 25) {
                state = 'rising'; showName();
                setTimeout(() => { state = 'floating'; 
                    setTimeout(() => { state = 'falling'; 
                        setTimeout(() => { state = 'normal'; }, 2000);
                    }, 5000);
                }, 2800);
            }
        });

        function showName() {
            const name = window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || "GUEST";
            const ui = document.getElementById('ui-layer');
            const el = document.createElement('div');
            el.className = 'nickname';
            el.innerText = name.toUpperCase();
            el.style.left = '50%'; el.style.top = '85%'; 
            ui.appendChild(el);
            setTimeout(() => { el.style.top = (limitY + 60) + 'px'; el.style.opacity = '0'; }, 100);
            setTimeout(() => el.remove(), 4500);
        }

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission();
        }, {once: true});
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
