<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
            overflow: hidden; touch-action: none; 
        }
        
        .header { 
            position: absolute; top: 40px; width: 100%; 
            display: flex; justify-content: space-around; z-index: 100; 
        }

        .btn { 
            width: 32px; height: 32px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.85); }

        #flash { 
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            width: 120px; height: 120px; border-radius: 50%; 
            opacity: 0; pointer-events: none; z-index: 50;
            filter: blur(15px);
        }

        #liquid-container { 
            width: 100vw; height: 100vh; 
            filter: blur(3px) contrast(12); /* Эффект мягкого слияния */
            background: transparent;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="btn" style="background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8);" onclick="buy('#3b82f6')"></div>
        <div class="btn" style="background: radial-gradient(circle at 30% 30%, #4ade80, #15803d);" onclick="buy('#22c55e')"></div>
        <div class="btn" style="background: radial-gradient(circle at 30% 30%, #ffffff, #94a3b8);" onclick="buy('#ffffff')"></div>
        <div class="btn" style="background: radial-gradient(circle at 30% 30%, #c084fc, #7e22ce);" onclick="buy('#a855f7')"></div>
    </div>
    
    <div id="flash"></div>
    <div id="liquid-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite } = Matter;
        const engine = Engine.create();
        
        engine.positionIterations = 15; // Максимальная точность углов
        engine.timing.timeScale = 0.4;  // Плавность воды

        const render = Render.create({
            element: document.getElementById('liquid-container'),
            engine: engine,
            options: { 
                width: window.innerWidth, 
                height: window.innerHeight, 
                wireframes: false, 
                background: 'transparent' 
            }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        // "Бронированные" стены внахлест
        const T = 1000;
        const W = window.innerWidth;
        const H = window.innerHeight;
        const walls = [
            Bodies.rectangle(W/2, H + T/2 - 2, W * 2, T, { isStatic: true, friction: 0.01 }),
            Bodies.rectangle(-T/2 + 2, H/2, T, H * 2, { isStatic: true, friction: 0.01 }),
            Bodies.rectangle(W + T/2 - 2, H/2, T, H * 2, { isStatic: true, friction: 0.01 })
        ];
        Composite.add(engine.world, walls);

        function buy(color) {
            const f = document.getElementById('flash');
            f.style.background = `radial-gradient(circle, ${color} 0%, transparent 80%)`;
            f.style.transition = 'none';
            f.style.opacity = '0.8';
            
            setTimeout(() => {
                f.style.transition = 'opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
                f.style.opacity = '0';
                
                const drop = Bodies.circle(W/2, H/2 - 10, 3.8, {
                    restitution: 0.02,
                    frictionAir: 0.12,
                    render: { 
                        fillStyle: color,
                        // Добавляем свечение через canvas (через тень частицы)
                        sprite: { xScale: 1, yScale: 1 }
                    }
                });
                
                Composite.add(engine.world, drop);
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    Telegram.WebApp.HapticFeedback.impactOccurred('medium');
                }
            }, 50);
        }

        // Интеллектуальный гироскоп
        window.addEventListener('deviceorientation', (e) => {
            let gx = (e.gamma || 0) / 70;
            let gy = (e.beta || 0) / 70;
            engine.gravity.x = gx;
            engine.gravity.y = gy;
        });

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(()=>{});
            }
        }, {once: true});

        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
