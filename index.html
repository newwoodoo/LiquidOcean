<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #010206; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; transition: transform 0.4s ease-out; }
        
        .ui { position: absolute; z-index: 1000; width: 100%; pointer-events: none; }
        .bottom-bar { 
            position: absolute; bottom: 0; width: 100%; height: 100px; 
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex; justify-content: center; align-items: center; gap: 8px; pointer-events: auto;
        }
        
        .btn { 
            width: 46px; height: 46px; border-radius: 12px; 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* Стиль звезды за $3 */
        .star-container { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
        .star-core { width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px #fff; position: relative; z-index: 2; }
        .ray {
            position: absolute; top: 50%; left: 50%; height: 1px; width: 14px;
            transform-origin: left center; opacity: 0.7; z-index: 1;
            animation: colorFlow 5s infinite linear;
        }
        @keyframes colorFlow {
            0% { background: #ff4d4d; } 25% { background: #4dff4d; }
            50% { background: #4d4dff; } 75% { background: #ffff4d; } 100% { background: #ff4d4d; }
        }

        #aim-circle {
            position: absolute; width: 180px; height: 180px; border: 2px dashed #f1c40f;
            border-radius: 50%; display: none; pointer-events: none; z-index: 2000;
        }
        #aim-line { position: absolute; height: 3px; background: #f1c40f; transform-origin: left center; width: 0; top: 50%; left: 50%; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="aim-circle"><div id="aim-line"></div></div>

    <div class="bottom-bar" id="menu">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 25)">$25</div>
        <div class="btn" ontouchstart="initDrag(event, 'comet', 50)">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 1, offsetX = 0, offsetY = 0, originalScale = 1;
        let activeDrag = null, isPanning = false, lastX = 0, lastY = 0;

        function initDrag(e, type, price) {
            const t = e.touches[0];
            activeDrag = { type, price, x: t.pageX, y: t.pageY, started: false };
            originalScale = scale;
            haptic('light');
        }

        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (activeDrag) {
                activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                // Если вывели палец из зоны меню (выше 120px от низа)
                if (window.innerHeight - t.pageY > 120 && !activeDrag.started) {
                    activeDrag.started = true;
                    scale = (activeDrag.price <= 10) ? 6 : 2;
                    updateTransform();
                }
                if (activeDrag.started) {
                    checkEdgeScroll(t.pageX, t.pageY);
                    if (activeDrag.type === 'comet') showAim(t.pageX, t.pageY);
                }
            } else if (isPanning) {
                offsetX += t.pageX - lastX; offsetY += t.pageY - lastY;
                lastX = t.pageX; lastY = t.pageY;
                updateTransform();
            }
        });

        window.addEventListener('touchend', (e) => {
            if (activeDrag && activeDrag.started) {
                const worldX = (activeDrag.x - offsetX) / scale;
                const worldY = (activeDrag.y - offsetY) / scale;
                
                if (activeDrag.type === 'star') placeStar(worldX, worldY, activeDrag.price);
                else placeComet(worldX, worldY);
                
                setTimeout(() => { scale = originalScale; updateTransform(); }, 600);
            }
            activeDrag = null; isPanning = false;
            document.getElementById('aim-circle').style.display = 'none';
        });

        window.addEventListener('touchstart', (e) => {
            if (!e.target.closest('.btn')) {
                isPanning = true;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        function placeStar(x, y, p) {
            const container = document.createElement('div');
            container.className = 'star-container';
            container.style.left = x + 'px'; container.style.top = y + 'px';
            
            const core = document.createElement('div');
            core.className = 'star-core';
            
            if (p === 3) {
                for(let i=0; i<6; i++) {
                    const r = document.createElement('div');
                    r.className = 'ray';
                    r.style.transform = `rotate(${i * 60}deg)`;
                    container.appendChild(r);
                }
            } else {
                const s = p === 25 ? 8 : (p === 10 ? 5 : 2);
                core.style.width = s+'px'; core.style.height = s+'px';
            }
            
            container.appendChild(core);
            view.appendChild(container);
            haptic('medium');
        }

        function placeComet(x, y) {
            const b = Bodies.circle(x, y, 3, { frictionAir: 0 });
            const v = document.createElement('div');
            v.className = 'star-container';
            v.innerHTML = '<div style="width:6px;height:6px;background:#fff;border-radius:50%;box-shadow:0 0 15px orange;"></div>';
            view.appendChild(v);
            Body.setVelocity(b, { x: 0.03, y: -0.015 });
            b.visual = v;
            Composite.add(engine.world, b);
            haptic('heavy');
        }

        function checkEdgeScroll(x, y) {
            const pad = 50;
            if (x < pad) offsetX += 8;
            if (x > window.innerWidth - pad) offsetX -= 8;
            if (y < pad) offsetY += 8;
            updateTransform();
        }

        function showAim(x, y) {
            const a = document.getElementById('aim-circle');
            a.style.display = 'block'; a.style.left = (x - 90) + 'px'; a.style.top = (y - 90) + 'px';
        }

        function updateTransform() { view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`; }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(b => {
                if (b.visual) { b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px'; }
            });
        });

        function haptic(s) { if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred(s); }
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
