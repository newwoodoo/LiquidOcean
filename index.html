<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #F5F1E9; overflow: hidden; touch-action: none; }
        .header { position: absolute; top: 50px; width: 100%; display: flex; justify-content: space-around; z-index: 100; }
        .btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.9); }
        #flash { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 1px; height: 1px; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 50; }
        #liquid-container { width: 100vw; height: 100vh; background: transparent; }
    </style>
</head>
<body>
    <div class="header">
        <div class="btn" style="background: #79addc;" onclick="buy('#79addc', 2.2)"></div>
        <div class="btn" style="background: #a3c586;" onclick="buy('#a3c586', 2.9)"></div>
        <div class="btn" style="background: #ffffff;" onclick="buy('#ffffff', 3.5)"></div>
        <div class="btn" style="background: #9b89b3;" onclick="buy('#9b89b3', 4.4)"></div>
    </div>
    <div id="flash"></div>
    <div id="liquid-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
        const engine = Engine.create();
        
        engine.timing.timeScale = 0.8; // Увеличил общую скорость
        let targetGravity = { x: 0, y: 1 };
        let currentGravity = { x: 0, y: 1 };

        const render = Render.create({
            element: document.getElementById('liquid-container'),
            engine: engine,
            options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: 'transparent' }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        const T = 1000, W = window.innerWidth, H = window.innerHeight, safeArea = 15;
        const walls = [
            Bodies.rectangle(W/2, H + T/2 - safeArea, W * 2, T, { isStatic: true, friction: 0.05, label: 'ground' }),
            Bodies.rectangle(-T/2, H/2, T, H * 2, { isStatic: true, friction: 0.05 }),
            Bodies.rectangle(W + T/2, H/2, T, H * 2, { isStatic: true, friction: 0.05 })
        ];
        Composite.add(engine.world, walls);

        function buy(color, radius) {
            const f = document.getElementById('flash');
            f.style.transition = 'none'; f.style.width = '0px'; f.style.height = '0px';
            f.style.border = `1px solid ${color}`; f.style.opacity = '0.5';
            
            setTimeout(() => {
                f.style.transition = 'all 0.6s ease-out'; f.style.width = '80px'; f.style.height = '80px'; f.style.opacity = '0';
                
                const drop = Bodies.circle(W/2, H/2, radius, {
                    restitution: 0.1,
                    frictionAir: 0.02,
                    friction: 0.01,
                    render: { fillStyle: color },
                    label: 'falling' // Помечаем как падающую
                });
                
                Composite.add(engine.world, drop);
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }, 10);
        }

        // Логика инерции и раздельной гравитации
        Events.on(engine, 'beforeUpdate', () => {
            // Плавное следование гравитации (инерция)
            currentGravity.x += (targetGravity.x - currentGravity.x) * 0.05;
            currentGravity.y += (targetGravity.y - currentGravity.y) * 0.05;

            const allBodies = Composite.allBodies(engine.world);
            allBodies.forEach(body => {
                if (!body.isStatic) {
                    if (body.label === 'falling') {
                        // Падает строго вниз, игнорируя наклон
                        body.force.x = 0;
                        body.force.y = body.mass * 0.001; 
                    } else {
                        // Остальные подчиняются инерционному гироскопу
                        engine.gravity.x = currentGravity.x;
                        engine.gravity.y = currentGravity.y;
                    }
                }
            });
        });

        // Снимаем метку "falling" при первом же столкновении
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                if (pair.bodyA.label === 'falling') pair.bodyA.label = 'liquid';
                if (pair.bodyB.label === 'falling') pair.bodyB.label = 'liquid';
            });
        });

        window.addEventListener('deviceorientation', (e) => {
            targetGravity.x = Math.max(Math.min((e.gamma || 0) / 45, 1.2), -1.2);
            targetGravity.y = Math.max(Math.min((e.beta || 0) / 45, 1.2), -1.2);
        });

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        }, {once: true});
        Telegram.WebApp.ready();
    </script>
</body>
</html>
