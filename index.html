<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        /* Мини-карта и Шкала Зума */
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10000; pointer-events: none; }
        #zoom-bar { width: 80px; height: 4px; background: rgba(255,255,255,0.1); margin-bottom: 5px; border-radius: 2px; position: relative; overflow: hidden; }
        #zoom-indicator { position: absolute; height: 100%; background: #f1c40f; left: 50%; transform: translateX(-50%); width: 0%; transition: width 0.1s; }
        #minimap { width: 80px; height: 80px; background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 4px; position: relative; }
        #minimap-point { position: absolute; width: 5px; height: 5px; background: #ff0; border-radius: 50%; transform: translate(-50%, -50%); top: 50%; left: 50%; box-shadow: 0 0 8px #ff0; }

        .ui-panel { position: absolute; bottom: 0; width: 100%; height: 90px; background: #111; display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 10001; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
        .btn { width: 50px; height: 50px; border-radius: 12px; background: #222; border: 1px solid #444; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

        .obj { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; }
        
        .ray-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .ray { 
            position: absolute; top: 50%; left: 50%; width: 1px; height: 40px; 
            background: linear-gradient(to top, rgba(255,255,255,0.8), transparent); 
            transform-origin: bottom center; 
            animation: rayPulse 2s infinite alternate;
        }
        @keyframes rayPulse { from { opacity: 0.1; height: 35px; } to { opacity: 0.5; height: 45px; } }

        .comet-v { position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 50%; z-index: 999; }
        .comet-shield {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 28px; height: 12px; border-radius: 28px 28px 0 0;
            background: radial-gradient(ellipse at bottom, rgba(255,255,255,0.4), transparent 80%);
        }
        .comet-tail {
            position: absolute; top: 0px; left: 50%; width: 30px; height: 160px;
            background: linear-gradient(to bottom, var(--c) 0%, transparent 100%);
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            transform: translateX(-50%); opacity: 0.6;
        }

        #aim-ui { position: absolute; width: 180px; height: 180px; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 5000; }
        .sector { position: absolute; width: 50%; height: 50%; left: 50%; top: 50%; transform-origin: 0 0; clip-path: polygon(0 0, 100% 0, 85% 35%, 0 0); }
        .sector.active { background: rgba(241,196,15,0.4); border-top: 2px solid #f1c40f; }
    </style>
</head>
<body>
    <div id="ui-container">
        <div id="zoom-bar"><div id="zoom-indicator"></div></div>
        <div id="minimap"><div id="minimap-point"></div></div>
    </div>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="ui-panel">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet')" onclick="confirmLaunch()">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 0.25, offsetX = window.innerWidth/2, offsetY = window.innerHeight/2;
        let lastDist = 0, activeDrag = null, isPanning = false, lastX = 0, lastY = 0, cometPending = null;

        const MIN_ZOOM = 0.05, MAX_ZOOM = 0.45;
        const cometColors = ['#ff4500', '#00d4ff', '#2ecc71', '#f1c40f'];

        const aimUI = document.getElementById('aim-ui');
        for(let i=0; i<16; i++) {
            let s = document.createElement('div'); s.className = 'sector';
            s.style.transform = `rotate(${i * 22.5 - 11.25}deg)`; aimUI.appendChild(s);
        }

        function initDrag(e, type, price) {
            activeDrag = { type, price, x: e.touches[0].pageX, y: e.touches[0].pageY, active: false };
        }

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0];
                if (window.innerHeight - t.pageY > 110) activeDrag.active = true, activeDrag.x = t.pageX, activeDrag.y = t.pageY;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const mid = { x: (e.touches[0].pageX + e.touches[1].pageX)/2, y: (e.touches[0].pageY + e.touches[1].pageY)/2 };
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), MIN_ZOOM), MAX_ZOOM);
                offsetX -= (mid.x - offsetX) * (nextScale / scale - 1);
                offsetY -= (mid.y - offsetY) * (nextScale / scale - 1);
                scale = nextScale; lastDist = dist; updateTransform();
            } else if (isPanning) {
                offsetX += e.touches[0].pageX - lastX; offsetY += e.touches[0].pageY - lastY;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY; updateTransform();
            }
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                cometPending.angle = Math.atan2(dy, dx);
                updateSectors(cometPending.angle);
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            else if (!e.target.closest('.ui-panel')) isPanning = true, lastX = e.touches[0].pageX, lastY = e.touches[0].pageY;
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                const wx = (activeDrag.x - offsetX) / scale;
                const wy = (activeDrag.y - offsetY) / scale;
                if (activeDrag.type === 'star') placeStar(wx, wy, activeDrag.price);
                else prepareComet(wx, wy);
            }
            activeDrag = null; isPanning = false;
        });

        function placeStar(x, y, p) {
            const size = p === 1 ? 14 : (p === 3 ? 24 : 40);
            const b = Bodies.circle(x, y, size/2, { isStatic: true, label: 'star', price: p });
            const v = document.createElement('div'); v.className = 'obj';
            v.style.width = size+'px'; v.style.height = size+'px';
            v.style.background = '#fff'; v.style.boxShadow = `0 0 ${size/2}px #fff`;
            
            if (p === 3) {
                const c = document.createElement('div'); c.className = 'ray-container';
                for(let i=0; i<8; i++) {
                    let r = document.createElement('div'); r.className = 'ray';
                    r.style.transform = `translate(-50%, -100%) rotate(${i*45}deg)`;
                    c.appendChild(r);
                }
                v.appendChild(c);
            }
            if (p === 10) {
                let r = document.createElement('div'); r.style.cssText = `position:absolute;top:50%;left:50%;width:${size*2.2}px;height:${size*2.2}px;border:1px solid rgba(255,255,255,0.2);border-radius:50%;transform:translate(-50%,-50%) rotateX(70deg);`;
                v.appendChild(r);
            }
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }
