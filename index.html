<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Ocean</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020617;
            font-family: sans-serif;
            touch-action: none;
        }

        /* Уменьшенные в 2 раза кнопки */
        .shop-header {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 20;
        }

        .drop-btn {
            width: 25px;
            height: 25px;
            border-radius: 50% 50% 50% 10%;
            transform: rotate(-45deg);
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .drop-btn:active { transform: rotate(-45deg) scale(0.8); }
        .b-blue { background: #3b82f6; }
        .b-green { background: #22c55e; }
        .b-white { background: #ffffff; }
        .b-purple { background: #a855f7; }

        /* Контейнер с эффектом жидкости */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            filter: blur(3px) contrast(15);
            background: #020617;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        .nickname {
            position: absolute;
            color: rgba(255,255,255,0.5);
            font-size: 9px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="shop-header">
        <button class="drop-btn b-blue" onclick="spawnDrop('#3b82f6')"></button>
        <button class="drop-btn b-green" onclick="spawnDrop('#22c55e')"></button>
        <button class="drop-btn b-white" onclick="spawnDrop('#ffffff')"></button>
        <button class="drop-btn b-purple" onclick="spawnDrop('#a855f7')"></button>
    </div>

    <div id="ui-layer"></div>
    <div id="canvas-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, World } = Matter;

        const engine = Engine.create();
        const container = document.getElementById('canvas-container');
        
        const render = Render.create({
            element: container,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Границы экрана
        const wallOptions = { isStatic: true, render: { visible: false } };
        World.add(engine.world, [
            Bodies.rectangle(window.innerWidth/2, window.innerHeight + 25, window.innerWidth, 50, wallOptions),
            Bodies.rectangle(-25, window.innerHeight/2, 50, window.innerHeight, wallOptions),
            Bodies.rectangle(window.innerWidth + 25, window.innerHeight/2, 50, window.innerHeight, wallOptions)
        ]);

        function spawnDrop(color) {
            const x = window.innerWidth / 2 + (Math.random() * 20 - 10);
            // Размер как точка (очень маленький)
            const radius = 2.5; 
            const drop = Bodies.circle(x, 10, radius, {
                restitution: 0.1,
                friction: 0.01,
                density: 0.001,
                render: { fillStyle: color }
            });
            
            drop.isMine = true;
            World.add(engine.world, drop);
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        // Правильный гироскоп (без инверсии)
        window.addEventListener('deviceorientation', (event) => {
            const gravity = engine.gravity;
            // Корректное направление: gamma - лево/право, beta - перед/зад
            gravity.x = event.gamma / 30; 
            gravity.y = event.beta / 30;
        });

        // Встряска для всплытия
        let lastX = 0;
        window.addEventListener('devicemotion', (event) => {
            const acc = event.acceleration;
            if (!acc) return;
            let diff = Math.abs(acc.x - lastX);
            if (diff > 12) {
                const userName = Telegram.WebApp.initDataUnsafe?.user?.first_name || "Guest";
                Composite.allBodies(engine.world).forEach(body => {
                    if (body.isMine && !body.isStatic) {
                        Matter.Body.applyForce(body, body.position, { x: 0, y: -0.0005 });
                        if (Math.random() > 0.9) showNickname(body.position.x, body.position.y, userName);
                    }
                });
            }
            lastX = acc.x;
        });

        function showNickname(x, y, name) {
            const el = document.createElement('div');
            el.className = 'nickname';
            el.innerText = name;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.getElementById('ui-layer').appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        document.body.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        });

        Telegram.WebApp.ready();
    </script>
</body>
</html>
