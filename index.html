<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; color: white; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; cursor: move; }
        
        #ui-top { position: absolute; top: 20px; left: 20px; z-index: 10000; pointer-events: none; }
        #zoom-bar { width: 100px; height: 4px; background: rgba(255,255,255,0.1); margin-bottom: 8px; border-radius: 2px; position: relative; }
        #zoom-indicator { position: absolute; height: 100%; background: #f1c40f; left: 50%; width: 0%; transform: translateX(-50%); }
        #minimap { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 1px solid #444; border-radius: 4px; position: relative; }
        #minimap-point { position: absolute; width: 4px; height: 4px; background: #ff0; border-radius: 50%; transform: translate(-50%, -50%); }

        .ui-panel { position: absolute; bottom: 0; width: 100%; height: 100px; background: #111; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10001; border-top: 1px solid #333; pointer-events: auto; }
        .btn { width: 55px; height: 55px; border-radius: 15px; background: #222; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .obj { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; }
        
        /* Анимации для $3 */
        .ray-classic { position: absolute; top: 50%; left: 50%; width: 2px; background: linear-gradient(to top, #fff, transparent); transform-origin: 50% 100%; animation: rayPulse 1.5s infinite alternate; }
        @keyframes rayPulse { from { height: 15px; opacity: 0.2; } to { height: 50px; opacity: 0.8; } }
        
        .far-ray-3 { position: absolute; top: 50%; left: 50%; width: 2px; height: 120px; transform-origin: 50% 100%; }
        @keyframes crazyBlink { 0% { opacity: 0.2; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0.2; transform: scale(1); } }

        /* Анимации для $10 */
        .belt-container { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; transform: translate(-50%, -50%) rotateX(75deg); animation: rotateOrbit 20s linear infinite; }
        @keyframes rotateOrbit { from { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(0deg); } to { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(360deg); } }
        .asteroid-bit { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; }
        .belt-line-static { position: absolute; width: 240%; height: 240%; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; top: -70%; left: -70%; display: none; }

        #aim-ui { position: absolute; width: 160px; height: 160px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 50%; display: none; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <div id="ui-top">
        <div id="zoom-bar"><div id="zoom-indicator"></div></div>
        <div id="minimap"><div id="minimap-point"></div></div>
    </div>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="ui-panel">
        <div class="btn" onmousedown="startDrag(event, 'star', 1)" ontouchstart="startDrag(event, 'star', 1)">$1</div>
        <div class="btn" onmousedown="startDrag(event, 'star', 3)" ontouchstart="startDrag(event, 'star', 3)">$3</div>
        <div class="btn" onmousedown="startDrag(event, 'star', 10)" ontouchstart="startDrag(event, 'star', 10)">$10</div>
        <div class="btn" onmousedown="startDrag(event, 'comet')" ontouchstart="startDrag(event, 'comet')">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 0.2, offsetX = window.innerWidth/2, offsetY = window.innerHeight/2;
        let lastDist = 0, dragObj = null, isPanning = false, lastX = 0, lastY = 0;
        const colors1 = ['#fff', '#0ff', '#f0f', '#0f0', '#ff0', '#f70', '#aaf'];

        function startDrag(e, type, price) {
            e.preventDefault();
            const pos = e.touches ? e.touches[0] : e;
            dragObj = { type, price, x: pos.pageX, y: pos.pageY, active: false };
        }

        window.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (!e.target.closest('.ui-panel')) {
                isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        window.addEventListener('touchmove', e => {
            if (dragObj) {
                const t = e.touches[0]; dragObj.x = t.pageX; dragObj.y = t.pageY;
                if (window.innerHeight - t.pageY > 120) dragObj.active = true;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const midX = (e.touches[0].pageX + e.touches[1].pageX)/2, midY = (e.touches[0].pageY + e.touches[1].pageY)/2;
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), 0.05), 0.8);
                offsetX = midX - (midX - offsetX) * (nextScale / scale);
                offsetY = midY - (midY - offsetY) * (nextScale / scale);
                scale = nextScale; lastDist = dist;
                updateView();
            } else if (isPanning) {
                offsetX += (e.touches[0].pageX - lastX);
                offsetY += (e.touches[0].pageY - lastY);
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                updateView();
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            if (dragObj && dragObj.active) {
                createObj((dragObj.x - offsetX)/scale, (dragObj.y - offsetY)/scale, dragObj.price);
            }
            dragObj = null; isPanning = false;
        });

        function createObj(x, y, p) {
            const size = p === 1 ? 12 : (p === 3 ? 28 : 55);
            const b = Bodies.circle(x, y, size/2, { isStatic: true, label: 's'+p });
            const v = document.createElement('div'); v.className = 'obj s-'+p;
            v.style.width = size+'px'; v.style.height = size+'px'; v.style.background = '#fff';

            if (p === 1) {
                v.style.boxShadow = `0 0 15px ${colors1[Math.floor(Math.random()*7)]}`;
            } else if (p === 3) {
                const rays = document.createElement('div'); rays.className = 'rays-wrap';
                for(let i=0; i<8; i++) {
                    let r = document.createElement('div'); r.className = 'ray-classic';
                    r.style.transform = `translate(-50%, -100%) rotate(${i*45}deg)`;
                    rays.appendChild(r);
                }
                v.appendChild(rays);
                ['#ff0', '#0ff', '#f0f'].forEach((c, i) => {
                    let fr = document.createElement('div'); fr.className = 'far-ray-3';
                    fr.style.background = `linear-gradient(to top, ${c}, transparent)`;
                    fr.style.transform = `translate(-50%, -100%) rotate(${i*120}deg)`;
                    v.appendChild(fr);
                });
            } else if (p === 10) {
                let belt = document.createElement('div'); belt.className = 'belt-container';
                for(let i=0; i<90; i++) {
                    let a = document.createElement('div'); a.className = 'asteroid-bit';
                    let ang = i * 0.07, rad = 50 + Math.random()*15;
                    a.style.left = 50 + rad * Math.cos(ang) + '%';
                    a.style.top = 50 + rad * Math.sin(ang) + '%';
                    belt.appendChild(a);
                }
                v.appendChild(belt);
                let line = document.createElement('div'); line.className = 'belt-line-static';
                v.appendChild(line);
            }
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function updateView() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            document.getElementById('zoom-indicator').style.width = ((scale - 0.05)/0.75)*100 + '%';
            document.getElementById('minimap-point').style.left = 50 - (offsetX - window.innerWidth/2)/200 + '%';
            document.getElementById('minimap-point').style.top = 50 - (offsetY - window.innerHeight/2)/200 + '%';

            document.querySelectorAll('.s-3').forEach(el => {
                const rw = el.querySelector('.rays-wrap');
                const frs = el.querySelectorAll('.far-ray-3');
                rw.style.display = scale > 0.3 ? 'block' : 'none';
                frs.forEach(f => f.style.display = scale <= 0.3 ? 'block' : 'none');
                el.style.animation = scale < 0.2 ? 'crazyBlink 0.6s infinite' : 'none';
            });

            document.querySelectorAll('.s-10').forEach(el => {
                const bc = el.querySelector('.belt-container');
                const bl = el.querySelector('.belt-line-static');
                bc.style.display = scale > 0.35 ? 'block' : 'none';
                bl.style.display = scale <= 0.35 ? 'block' : 'none';
                bl.style.borderWidth = scale < 0.15 ? '1px' : '3px';
            });
        }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px';
                    b.visual.style.top = b.position.y + 'px';
                }
            });
        });

        updateView();
    </script>
</body>
</html>
