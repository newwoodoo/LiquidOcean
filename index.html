<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        /* Контейнер для масштабирования */
        #universe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: center; transition: transform 0.1s ease-out; }
        
        /* Интерфейс */
        .ui-panel { position: absolute; z-index: 1000; width: 100%; pointer-events: none; }
        .top { top: 40px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .bottom { bottom: 30px; display: flex; justify-content: center; gap: 8px; }
        
        .btn { 
            pointer-events: auto; padding: 10px; border-radius: 12px; 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; font-size: 11px; cursor: pointer; text-align: center; min-width: 50px;
        }
        .btn.active { border-color: #f1c40f; box-shadow: 0 0 10px #f1c40f; background: rgba(241,196,15,0.2); }
        
        .zoom-container { pointer-events: auto; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 20px; display: flex; align-items: center; gap: 10px; }
        input[type=range] { width: 150px; accent-color: #f1c40f; }

        /* Эффект звезды */
        .star-visual {
            position: absolute; border-radius: 50%; background: #fff;
            box-shadow: 0 0 15px 4px rgba(255,255,255,0.8), 0 0 30px 8px rgba(255,255,255,0.4);
            pointer-events: none; transform: translate(-50%, -50%);
        }
        /* Эффект кометы */
        .comet-visual {
            position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px 2px #f1c40f; pointer-events: none; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="universe"></div>

    <div class="ui-panel top">
        <div class="zoom-container">
            <span>zoom</span>
            <input type="range" min="0.1" max="20" step="0.1" value="1" oninput="changeZoom(this.value)">
            <span id="zoom-val">1x</span>
        </div>
        <button class="btn" style="width:120px" onclick="toggleFilter()">ВСЕ / МОИ</button>
    </div>

    <div class="ui-panel bottom">
        <div class="btn active" id="b1" onclick="setMode('star', 1, 'b1')">$1</div>
        <div class="btn" id="b3" onclick="setMode('star', 3, 'b3')">$3</div>
        <div class="btn" id="b10" onclick="setMode('star', 10, 'b10')">$10</div>
        <div class="btn" id="b25" onclick="setMode('star', 25, 'b25')">$25</div>
        <div class="btn" id="bc" onclick="setMode('comet', 50, 'bc')">☄️ $50</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const universe = document.getElementById('universe');
        const runner = Runner.create();
        Runner.run(runner, engine);

        let mode = 'star';
        let currentPrice = 1;
        let zoom = 1;

        function setMode(m, p, id) {
            mode = m; currentPrice = p;
            document.querySelectorAll('.bottom .btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function changeZoom(v) {
            zoom = v;
            universe.style.transform = `scale(${v})`;
            document.getElementById('zoom-val').innerText = v + 'x';
        }

        window.addEventListener('click', (e) => {
            if (e.target.closest('.ui-panel')) return;

            // Вычисляем координаты с учетом зума
            const rect = universe.getBoundingClientRect();
            const x = (e.clientX - window.innerWidth/2) / zoom + window.innerWidth/2;
            const y = (e.clientY - window.innerHeight/2) / zoom + window.innerHeight/2;

            if (mode === 'star') createStar(x, y, currentPrice);
            else createComet(x, y);
        });

        function createStar(x, y, price) {
            const size = price === 25 ? 6 : (price === 10 ? 4 : 2);
            const starBody = Bodies.circle(x, y, size, { isStatic: true });
            
            const visual = document.createElement('div');
            visual.className = 'star-visual';
            visual.style.width = size + 'px'; visual.style.height = size + 'px';
            visual.style.left = x + 'px'; visual.style.top = y + 'px';
            
            if (price >= 10) {
                const name = prompt("Имя звезды:", "Звезда");
                if (name) {
                    const label = document.createElement('div');
                    label.style.position = 'absolute'; label.style.top = '-20px';
                    label.style.fontSize = '12px'; label.innerText = name;
                    visual.appendChild(label);
                }
            }

            universe.appendChild(visual);
            Composite.add(engine.world, starBody);
            haptic('light');
        }

        function createComet(x, y) {
            const cometBody = Bodies.circle(x, y, 3, { frictionAir: 0 });
            const visual = document.createElement('div');
            visual.className = 'comet-visual';
            visual.style.left = x + 'px'; visual.style.top = y + 'px';
            universe.appendChild(visual);
            
            // Задаем ОЧЕНЬ медленную скорость (пролетит экран за долгое время)
            Body.setVelocity(cometBody, { x: 0.02, y: -0.01 });
            
            cometBody.visual = visual;
            Composite.add(engine.world, cometBody);
            haptic('heavy');
        }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(body => {
                if (body.visual) {
                    body.visual.style.left = body.position.x + 'px';
                    body.visual.style.top = body.position.y + 'px';
                }
            });
        });

        function haptic(style) {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                if (style === 'light') Telegram.WebApp.HapticFeedback.impactOccurred('light');
                else Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
        }

        function toggleFilter() { alert("Функция будет доступна в общей сети."); }
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
