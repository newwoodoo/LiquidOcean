<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        /* Навигация */
        #minimap { position: absolute; top: 20px; left: 20px; width: 80px; height: 80px; background: rgba(255,255,255,0.05); border: 1px solid #333; z-index: 11000; border-radius: 4px; }
        #minimap-point { position: absolute; width: 4px; height: 4px; background: #ff0; border-radius: 50%; transform: translate(-50%, -50%); top: 50%; left: 50%; }

        .ui-panel { position: absolute; bottom: 0; width: 100%; height: 90px; background: #111; display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 10000; border-top: 1px solid #333; }
        .btn { width: 50px; height: 50px; border-radius: 12px; background: #222; color: #fff; display: flex; align-items: center; justify-content: center; border: 1px solid #444; }

        /* Объекты */
        .obj { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; }
        .glow { position: absolute; width: 150%; height: 150%; top: -25%; left: -25%; background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%); }
        
        /* Звезда за 3$ - Лучи */
        .ray { position: absolute; top: 50%; left: 50%; width: 2px; height: 40px; background: #fff; transform-origin: top center; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation: flicker 2s infinite alternate; }
        @keyframes flicker { from { opacity: 0.3; filter: hue-rotate(0deg); } to { opacity: 0.8; filter: hue-rotate(360deg); } }

        /* Пояса астероидов за 10$ */
        .ring { position: absolute; top: 50%; left: 50%; border: 2px dotted; border-radius: 50%; transform: translate(-50%, -50%) rotateX(75deg); opacity: 0.6; }

        /* Комета */
        .comet-v { position: absolute; width: 25px; height: 25px; background: #fff; border-radius: 50%; box-shadow: 0 0 30px #fff, 0 0 50px orange; z-index: 9999; }
        .comet-v::after { content: ''; position: absolute; top: 10px; left: 50%; width: 10px; height: 120px; background: linear-gradient(to bottom, orange, transparent); transform: translateX(-50%); }

        /* Сектора прицела */
        #aim-ui { position: absolute; width: 200px; height: 200px; border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 5000; border: 1px solid rgba(255,255,255,0.1); }
        .sector { position: absolute; width: 50%; height: 50%; left: 50%; top: 50%; transform-origin: 0 0; clip-path: polygon(0 0, 100% 0, 85% 35%, 0 0); border-top: 1px solid rgba(255,255,255,0.2); }
        .sector.active { background: rgba(241,196,15,0.5); border-top: 2px solid #f1c40f; }
    </style>
</head>
<body>
    <div id="minimap"><div id="minimap-point"></div></div>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="ui-panel">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet')" onclick="confirmLaunch()">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 0.3, offsetX = window.innerWidth/2, offsetY = window.innerHeight/2;
        let lastDist = 0, activeDrag = null, isPanning = false, lastX = 0, lastY = 0;
        let cometPending = null;

        const MIN_ZOOM = 0.05, MAX_ZOOM = 0.5; // Уменьшено на 30%
        const ringColors = ['#00f', '#f00', '#0f0', '#ff0', '#f0f', '#0ff', '#fff', '#ffa500', '#8a2be2', '#7fff00'];

        // Сектора
        const aimUI = document.getElementById('aim-ui');
        for(let i=0; i<16; i++) {
            let s = document.createElement('div'); s.className = 'sector';
            s.style.transform = `rotate(${i * 22.5 - 11.25}deg)`; aimUI.appendChild(s);
        }

        function initDrag(e, type, price) {
            activeDrag = { type, price, x: e.touches[0].pageX, y: e.touches[0].pageY, active: false };
        }

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0];
                if (window.innerHeight - t.pageY > 110) activeDrag.active = true, activeDrag.x = t.pageX, activeDrag.y = t.pageY;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const mid = { x: (e.touches[0].pageX + e.touches[1].pageX)/2, y: (e.touches[0].pageY + e.touches[1].pageY)/2 };
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), MIN_ZOOM), MAX_ZOOM);
                offsetX -= (mid.x - offsetX) * (nextScale / scale - 1);
                offsetY -= (mid.y - offsetY) * (nextScale / scale - 1);
                scale = nextScale; lastDist = dist; updateTransform();
            } else if (isPanning) {
                offsetX += e.touches[0].pageX - lastX; offsetY += e.touches[0].pageY - lastY;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY; updateTransform();
            }
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                cometPending.angle = Math.atan2(dy, dx);
                updateSectors(cometPending.angle);
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            else if (!e.target.closest('.ui-panel')) isPanning = true, lastX = e.touches[0].pageX, lastY = e.touches[0].pageY;
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                const wx = (activeDrag.x - offsetX) / scale;
                const wy = (activeDrag.y - offsetY) / scale;
                if (activeDrag.type === 'star') placeStar(wx, wy, activeDrag.price);
                else prepareComet(wx, wy);
            }
            activeDrag = null; isPanning = false;
        });

        function placeStar(x, y, p) {
            const size = p === 1 ? 20 : (p === 3 ? 30 : 45);
            const b = Bodies.circle(x, y, size/2, { isStatic: true });
            const v = document.createElement('div'); v.className = 'obj';
            v.style.width = size + 'px'; v.style.height = size + 'px';
            v.style.background = '#fff'; v.style.boxShadow = `0 0 20px #fff`;
            
            if (p === 3) { // Лучики для 3$
                for(let i=0; i<6; i++) {
                    let r = document.createElement('div'); r.className = 'ray';
                    r.style.transform = `translate(-50%, -100%) rotate(${i*60}deg)`;
                    v.appendChild(r);
                }
            }
            if (p === 10) { // Пояс астероидов для 10$
                let color = ringColors[Math.floor(Math.random()*10)];
                let r = document.createElement('div'); r.className = 'ring';
                r.style.width = (size * 2.5) + 'px'; r.style.height = (size * 2.5) + 'px';
                r.style.borderColor = color; r.style.boxShadow = `0 0 10px ${color}`;
                v.appendChild(r);
            }
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function prepareComet(x, y) {
            cometPending = { wx: x, wy: y, angle: 0 };
            aimUI.style.display = 'block';
            document.getElementById('comet-btn').classList.add('active-launch');
            updateTransform();
        }

        function confirmLaunch() {
            if (!cometPending) return;
            const b = Bodies.circle(cometPending.wx, cometPending.wy, 12, { frictionAir: 0 });
            b.isComet = true;
            const v = document.createElement('div'); v.className = 'comet-v';
            b.visual = v; view.appendChild(v);
            Body.setVelocity(b, { x: Math.cos(cometPending.angle) * 0.2, y: Math.sin(cometPending.angle) * 0.2 });
            Composite.add(engine.world, b);
            aimUI.style.display = 'none';
            document.getElementById('comet-btn').classList.remove('active-launch');
            cometPending = null;
        }

        function updateSectors(angle) {
            const index = (Math.round((angle * 180 / Math.PI) / 22.5) + 16) % 16;
            document.querySelectorAll('.sector').forEach((s, i) => s.classList.toggle('active', i === index));
        }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px';
                    if(b.isComet) {
                        const rot = Math.atan2(b.velocity.y, b.velocity.x) + Math.PI/2;
                        b.visual.style.transform = `translate(-50%, -50%) rotate(${rot}rad)`;
                    }
                }
            });
        });

        function updateTransform() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            if(cometPending) {
                aimUI.style.left = (cometPending.wx * scale + offsetX) + 'px';
                aimUI.style.top = (cometPending.wy * scale + offsetY) + 'px';
            }
            const point = document.getElementById('minimap-point');
            point.style.left = (50 - (offsetX / 25)) + '%';
            point.style.top = (50 - (offsetY / 25)) + '%';
        }

        updateTransform();
    </script>
</body>
</html>
