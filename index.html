<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Ocean</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020617;
            font-family: sans-serif;
            touch-action: none;
        }

        /* Кнопки разнесены для удобства */
        .shop-header {
            position: absolute;
            top: 30px;
            width: 100%;
            display: flex;
            justify-content: space-around; /* Максимальное расстояние между кнопками */
            padding: 0 10px;
            box-sizing: border-box;
            z-index: 20;
        }

        .drop-btn {
            width: 28px;
            height: 28px;
            border-radius: 50% 50% 50% 10%;
            transform: rotate(-45deg);
            border: 1.5px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .drop-btn:active { transform: rotate(-45deg) scale(0.8); }
        .b-blue { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
        .b-green { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .b-white { background: #ffffff; box-shadow: 0 0 10px #ffffff; }
        .b-purple { background: #a855f7; box-shadow: 0 0 10px #a855f7; }

        /* Вспышка в центре */
        #flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            filter: blur(3px) contrast(15);
            background: #020617;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }
    </style>
</head>
<body>

    <div class="shop-header">
        <button class="drop-btn b-blue" onclick="purchase('#3b82f6')"></button>
        <button class="drop-btn b-green" onclick="purchase('#22c55e')"></button>
        <button class="drop-btn b-white" onclick="purchase('#ffffff')"></button>
        <button class="drop-btn b-purple" onclick="purchase('#a855f7')"></button>
    </div>

    <div id="flash"></div>
    <div id="ui-layer"></div>
    <div id="canvas-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, World } = Matter;

        const engine = Engine.create();
        const container = document.getElementById('canvas-container');
        
        const render = Render.create({
            element: container,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Границы экрана
        const wallOptions = { isStatic: true, render: { visible: false } };
        World.add(engine.world, [
            Bodies.rectangle(window.innerWidth/2, window.innerHeight + 25, window.innerWidth, 50, wallOptions),
            Bodies.rectangle(-25, window.innerHeight/2, 50, window.innerHeight, wallOptions),
            Bodies.rectangle(window.innerWidth + 25, window.innerHeight/2, 50, window.innerHeight, wallOptions)
        ]);

        function purchase(color) {
            const flash = document.getElementById('flash');
            
            // Настройка градиентной вспышки под цвет капли
            flash.style.background = `radial-gradient(circle, ${color} 0%, rgba(0,0,0,0) 75%)`;
            
            // Анимация вспышки
            flash.style.opacity = '1';
            Telegram.WebApp.HapticFeedback.notificationOccurred('success');

            setTimeout(() => {
                flash.style.opacity = '0';
                flash.style.transition = 'opacity 0.6s ease-out';
                
                // Создание капли в центре после вспышки
                const x = window.innerWidth / 2;
                const y = window.innerHeight / 2;
                const radius = 2.8; 
                
                const drop = Bodies.circle(x, y, radius, {
                    restitution: 0.2,
                    friction: 0.01,
                    render: { fillStyle: color }
                });
                
                drop.isMine = true;
                World.add(engine.world, drop);
            }, 100);

            // Сброс transition для следующего раза
            flash.style.transition = 'none';
        }

        window.addEventListener('deviceorientation', (event) => {
            engine.gravity.x = event.gamma / 25; 
            engine.gravity.y = event.beta / 25;
        });

        // Встряска для всплытия
        let lastX = 0;
        window.addEventListener('devicemotion', (event) => {
            const acc = event.acceleration;
            if (!acc) return;
            if (Math.abs(acc.x - lastX) > 15) {
                Composite.allBodies(engine.world).forEach(body => {
                    if (body.isMine && !body.isStatic) {
                        Matter.Body.applyForce(body, body.position, { x: 0, y: -0.0008 });
                    }
                });
            }
            lastX = acc.x;
        });

        document.body.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        });

        Telegram.WebApp.ready();
    </script>
</body>
</html>
