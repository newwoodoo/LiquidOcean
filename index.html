<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #1a1a1a; 
            overflow: hidden; touch-action: none; 
            font-family: -apple-system, system-ui, sans-serif; 
        }
        .header { 
            position: absolute; top: 50px; width: 100%; 
            display: flex; justify-content: space-around; z-index: 100; 
        }
        .btn { 
            width: 44px; height: 44px; border-radius: 50%; 
            border: 2px solid rgba(255,255,255,0.3); cursor: pointer; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-weight: 800;
            transition: transform 0.1s;
        }
        .btn span { font-size: 10px; }
        .btn b { font-size: 13px; }
        .btn:active { transform: scale(0.85); }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; }
        .info-container {
            position: absolute; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center;
            transition: all 4.5s cubic-bezier(0.2, 0, 0.3, 1); 
        }
        .nickname {
            font-size: 16px; font-weight: 500; color: rgba(209, 204, 192, 0.7);
            letter-spacing: 3px; text-transform: uppercase;
        }
        .total-amount {
            font-size: 36px; font-weight: 900; color: #f1c40f;
            margin-top: 0px; text-shadow: 0 0 25px rgba(241, 196, 15, 0.6);
        }
    </style>
</head>
<body>
    <div id="ui-layer"></div>
    <div class="header">
        <div class="btn" style="background: #3498db;" onclick="buy('#3498db', 2.8, 1)"><b>$1</b></div>
        <div class="btn" style="background: #2ecc71;" onclick="buy('#2ecc71', 3.5, 3)"><b>$3</b></div>
        <div class="btn" style="background: #ffffff; color: #1a1a1a;" onclick="buy('#ffffff', 4.2, 10)"><b>$10</b></div>
        <div class="btn" style="background: #9b59b6;" onclick="buy('#9b59b6', 5.5, 25)"><b>$25</b></div>
    </div>
    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
        const engine = Engine.create();
        const W = window.innerWidth, H = window.innerHeight;
        let state = 'normal', gyroX = 0, gyroY = 1;
        let totalSpent = 0;

        const render = Render.create({
            element: document.body, engine: engine,
            options: { width: W, height: H, wireframes: false, background: 'transparent' }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        const walls = [
            Bodies.rectangle(W/2, H + 490, W * 2, 1000, { isStatic: true, friction: 0.1 }),
            Bodies.rectangle(-500, H/2, 1000, H * 2, { isStatic: true }),
            Bodies.rectangle(W + 500, H/2, 1000, H * 2, { isStatic: true })
        ];
        Composite.add(engine.world, walls);

        const limitY = H * 0.20; 

        function buy(color, radius, price) {
            totalSpent += price;
            const drop = Bodies.circle(W/2, H/2 - 50, radius, {
                restitution: 0.2, frictionAir: 0.05,
                render: { fillStyle: color, strokeStyle: 'rgba(255,255,255,0.4)', lineWidth: 1 }, 
                isMine: true, label: 'new'
            });
            Composite.add(engine.world, drop);
            
            if (window.Telegram?.WebApp?.HapticFeedback) {
                const type = price >= 10 ? 'heavy' : 'light';
                Telegram.WebApp.HapticFeedback.impactOccurred(type);
            }
        }

        Events.on(engine, 'beforeUpdate', () => {
            Composite.allBodies(engine.world).forEach(body => {
                if (body.isStatic) return;
                if (body.label === 'new') Body.setVelocity(body, { x: 0, y: body.velocity.y });
                if (body.isMine) {
                    if (state === 'rising') {
                        const dy = limitY - body.position.y;
                        Body.setVelocity(body, { x: 0, y: dy * 0.08 });
                    } else if (state === 'floating') {
                        Body.setVelocity(body, { x: 0, y: 0 });
                        Body.setPosition(body, { x: body.position.x, y: limitY });
                    }
                }
            });
            if (state === 'normal' || state === 'falling') {
                engine.gravity.x = gyroX; engine.gravity.y = state === 'falling' ? 2.2 : gyroY;
            } else {
                engine.gravity.x = 0; engine.gravity.y = 0;
            }
        });

        Events.on(engine, 'collisionStart', (e) => {
            e.pairs.forEach(p => {
                if (p.bodyA.label === 'new') p.bodyA.label = 'liquid';
                if (p.bodyB.label === 'new') p.bodyB.label = 'liquid';
            });
        });

        window.addEventListener('deviceorientation', (e) => {
            gyroX = (e.gamma || 0) / 45; gyroY = (e.beta || 0) / 45;
        });

        window.addEventListener('devicemotion', (e) => {
            const acc = e.acceleration;
            if (!acc || state !== 'normal') return;
            if (Math.abs(acc.x) + Math.abs(acc.y) > 26) {
                state = 'rising'; showInfo();
                setTimeout(() => { state = 'floating'; 
                    setTimeout(() => { state = 'falling'; 
                        setTimeout(() => { state = 'normal'; }, 2000);
                    }, 5000);
                }, 2800);
            }
        });

        function showInfo() {
            const name = window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || "OWNER";
            const ui = document.getElementById('ui-layer');
            const container = document.createElement('div');
            container.className = 'info-container';
            container.innerHTML = `
                <div class="nickname">${name}</div>
                <div class="total-amount">$${totalSpent}</div>
            `;
            container.style.left = '50%'; container.style.top = '85%'; 
            ui.appendChild(container);
            
            setTimeout(() => { 
                container.style.top = (limitY + 40) + 'px'; 
                container.style.opacity = '0'; 
            }, 100);
            setTimeout(() => container.remove(), 5000);
        }

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission();
        }, {once: true});
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
