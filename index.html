<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #fdf6e3; /* Кремовый фон */
            overflow: hidden; touch-action: none; 
        }
        
        .header { 
            position: absolute; top: 40px; width: 100%; 
            display: flex; justify-content: space-around; z-index: 100; 
        }

        .btn { 
            width: 34px; height: 34px; border-radius: 50%; 
            border: 2px solid rgba(0,0,0,0.05); cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.9); }

        #flash { 
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px; border-radius: 50%; 
            opacity: 0; pointer-events: none; z-index: 50;
            filter: blur(20px);
        }

        #liquid-container { 
            width: 100vw; height: 100vh; 
            filter: blur(2.5px) contrast(12);
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="btn" style="background: radial-gradient(circle at 30% 30%, #7dd3fc, #38bdf8);" onclick="buy('#38bdf8', 2.2)"></div>
        <div class="btn" style="background: radial-gradient(circle at 30% 30%, #bbf7d0, #86efac);" onclick="buy('#93c47d', 2.9)"></div>
        <div class="btn" style="background: radial-gradient(circle at 30% 30%, #fff7ed, #ffedd5);" onclick="buy('#f9f7f2', 3.5)"></div>
        <div class="btn" style="background: radial-gradient(circle at 30% 30%, #e9d5ff, #d8b4fe);" onclick="buy('#b4a7d6', 4.4)"></div>
    </div>
    
    <div id="flash"></div>
    <div id="liquid-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite } = Matter;
        const engine = Engine.create();
        engine.timing.timeScale = 0.45;

        const render = Render.create({
            element: document.getElementById('liquid-container'),
            engine: engine,
            options: { 
                width: window.innerWidth, height: window.innerHeight, 
                wireframes: false, background: 'transparent' 
            }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        const T = 1000;
        const W = window.innerWidth;
        const H = window.innerHeight;
        const walls = [
            Bodies.rectangle(W/2, H + T/2 - 2, W * 2, T, { isStatic: true, friction: 0.1 }),
            Bodies.rectangle(-T/2 + 2, H/2, T, H * 2, { isStatic: true, friction: 0.1 }),
            Bodies.rectangle(W + T/2 - 2, H/2, T, H * 2, { isStatic: true, friction: 0.1 })
        ];
        Composite.add(engine.world, walls);

        function buy(color, radius) {
            const f = document.getElementById('flash');
            // Теплая "солнечная" вспышка
            f.style.background = `radial-gradient(circle, #ffedd5 0%, transparent 70%)`;
            f.style.transition = 'none';
            f.style.opacity = '0.7';
            
            setTimeout(() => {
                f.style.transition = 'opacity 1s ease-out';
                f.style.opacity = '0';
                
                const drop = Bodies.circle(W/2, H/2, radius, {
                    restitution: 0.05,
                    frictionAir: 0.08,
                    render: { fillStyle: color }
                });
                
                Composite.add(engine.world, drop);
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
            }, 50);
        }

        window.addEventListener('deviceorientation', (e) => {
            engine.gravity.x = (e.gamma || 0) / 75;
            engine.gravity.y = (e.beta || 0) / 75;
        });

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(()=>{});
            }
        }, {once: true});

        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
