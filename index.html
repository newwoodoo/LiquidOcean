<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10000; pointer-events: none; }
        #zoom-bar { width: 80px; height: 6px; background: rgba(255,255,255,0.1); margin-bottom: 5px; border-radius: 3px; position: relative; overflow: hidden; border: 1px solid #333; }
        #zoom-indicator { position: absolute; height: 100%; background: #f1c40f; width: 0%; transition: width 0.1s; }
        #minimap { width: 80px; height: 80px; background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 4px; position: relative; overflow: hidden; }
        #minimap-point { position: absolute; width: 6px; height: 6px; background: #ff0; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #ff0; }

        .ui-panel { position: absolute; bottom: 0; width: 100%; height: 100px; background: #111; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10001; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
        .btn { width: 55px; height: 55px; border-radius: 15px; background: #222; border: 1px solid #444; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; }

        .obj { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; }
        
        .ray { 
            position: absolute; top: 50%; left: 50%; width: 2px; height: 40px; 
            background: linear-gradient(to top, #fff, transparent); 
            transform-origin: bottom center; 
            animation: rayPulse 1.5s infinite alternate;
        }
        @keyframes rayPulse { from { opacity: 0.2; transform: translate(-50%, -100%) scaleY(0.7); } to { opacity: 0.6; transform: translate(-50%, -100%) scaleY(1.1); } }

        .comet-v { position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; z-index: 999; }
        .comet-shield { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 32px; height: 14px; border-radius: 32px 32px 0 0; background: radial-gradient(ellipse at bottom, rgba(255,255,255,0.5), transparent 80%); }
        .comet-tail { position: absolute; top: 2px; left: 50%; width: 32px; height: 150px; background: linear-gradient(to bottom, var(--c), transparent); clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); transform: translateX(-50%); opacity: 0.6; }

        #aim-ui { position: absolute; width: 160px; height: 160px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 5000; }
    </style>
</head>
<body>
    <div id="ui-container">
        <div id="zoom-bar"><div id="zoom-indicator"></div></div>
        <div id="minimap"><div id="minimap-point"></div></div>
    </div>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="ui-panel">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet')" onclick="confirmLaunch()">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 0.2, offsetX = window.innerWidth/2, offsetY = window.innerHeight/2;
        let lastDist = 0, activeDrag = null, isPanning = false, lastX = 0, lastY = 0, cometPending = null;

        const MIN_ZOOM = 0.05, MAX_ZOOM = 0.5;
        const PAN_SPEED = 0.02; // Замедление в 50 раз

        function initDrag(e, type, price) {
            e.stopPropagation();
            const t = e.touches[0];
            activeDrag = { type, price, x: t.pageX, y: t.pageY, active: false };
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (!e.target.closest('.ui-panel')) {
                isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0];
                activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                if (window.innerHeight - t.pageY > 120) activeDrag.active = true;
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t1.pageX - t2.pageX, t1.pageY - t2.pageY);
                const midX = (t1.pageX + t2.pageX) / 2, midY = (t1.pageY + t2.pageY) / 2;
                
                const delta = dist / lastDist;
                const nextScale = Math.min(Math.max(scale * delta, MIN_ZOOM), MAX_ZOOM);
                
                // Зум ровно под пальцами
                offsetX -= (midX - offsetX) * (nextScale / scale - 1);
                offsetY -= (midY - offsetY) * (nextScale / scale - 1);
                
                scale = nextScale; lastDist = dist;
                updateTransform();
            } else if (isPanning) {
                // Плавное движение (замедленное)
                offsetX += (e.touches[0].pageX - lastX) * PAN_SPEED;
                offsetY += (e.touches[0].pageY - lastY) * PAN_SPEED;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                updateTransform();
            }
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                cometPending.angle = Math.atan2(dy, dx);
            }
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                const wx = (activeDrag.x - offsetX) / scale;
                const wy = (activeDrag.y - offsetY) / scale;
                if (activeDrag.type === 'star') placeStar(wx, wy, activeDrag.price);
                else prepareComet(wx, wy);
            }
            activeDrag = null; isPanning = false;
        });

        function placeStar(x, y, p) {
            const size = p === 1 ? 15 : (p === 3 ? 25 : 45);
            const b = Bodies.circle(x, y, size/2, { isStatic: true, label: 'star', price: p });
            const v = document.createElement('div'); v.className = 'obj';
            v.style.width = size+'px'; v.style.height = size+'px';
            v.style.background = '#fff'; v.style.boxShadow = `0 0 ${size/2}px #fff`;
            
            if (p === 3) {
                for(let i=0; i<8; i++) {
                    let r = document.createElement('div'); r.className = 'ray';
                    r.style.transform = `translate(-50%, -100%) rotate(${i*45}deg)`;
                    v.appendChild(r);
                }
            }
            if (p === 10) {
                let r = document.createElement('div'); r.style.cssText = `position:absolute;top:50%;left:50%;width:${size*2}px;height:${size*2}px;border:1px solid rgba(255,255,255,0.3);border-radius:50%;transform:translate(-50%,-50%) rotateX(75deg);`;
                v.appendChild(r);
            }
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function prepareComet(x, y) {
            cometPending = { wx: x, wy: y, angle: 0 };
            document.getElementById('aim-ui').style.display = 'block';
            updateTransform();
        }

        function confirmLaunch() {
            if (!cometPending) return;
            const b = Bodies.circle(cometPending.wx, cometPending.wy, 8, { frictionAir: 0, restitution: 0.9, label: 'comet' });
            const v = document.createElement('div'); v.className = 'comet-v';
            const color = ['#ff4500', '#00d4ff', '#2ecc71', '#f1c40f'][Math.floor(Math.random()*4)];
            v.style.boxShadow = `0 0 15px ${color}`;
            v.innerHTML = `<div class="comet-shield"></div><div class="comet-tail" style="--c:${color}"></div>`;
            b.visual = v; view.appendChild(v);
            Body.setVelocity(b, { x: Math.cos(cometPending.angle)*6, y: Math.sin(cometPending.angle)*6 });
            Composite.add(engine.world, b);
            document.getElementById('aim-ui').style.display = 'none';
            cometPending = null;
        }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px';
                    if (b.label === 'comet') {
                        const rot = Math.atan2(b.velocity.y, b.velocity.x) + Math.PI/2;
                        b.visual.style.transform = `translate(-50%, -50%) rotate(${rot}rad)`;
                    }
                }
            });
        });

        function updateTransform() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            const aim = document.getElementById('aim-ui');
            if(cometPending) {
                aim.style.left = (cometPending.wx * scale + offsetX) + 'px';
                aim.style.top = (cometPending.wy * scale + offsetY) + 'px';
            }
            // Шкала зума
            const zPct = ((scale - MIN_ZOOM) / (MAX_ZOOM - MIN_ZOOM)) * 100;
            document.getElementById('zoom-indicator').style.width = zPct + '%';
            // Ограничение точки на мини-карте
            let mX = 50 - (offsetX / (100 * scale));
            let mY = 50 - (offsetY / (100 * scale));
            document.getElementById('minimap-point').style.left = Math.max(5, Math.min(95, mX)) + '%';
            document.getElementById('minimap-point').style.top = Math.max(5, Math.min(95, mY)) + '%';
        }

        updateTransform();
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
