<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #020617; overflow: hidden; touch-action: none; }
        .header { position: absolute; top: 40px; width: 100%; display: flex; justify-content: space-around; z-index: 10; }
        .btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        #flash { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 5;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="btn" style="background:#3b82f6" onclick="buy('#3b82f6')"></div>
        <div class="btn" style="background:#22c55e" onclick="buy('#22c55e')"></div>
        <div class="btn" style="background:#ffffff" onclick="buy('#ffffff')"></div>
        <div class="btn" style="background:#a855f7" onclick="buy('#a855f7')"></div>
    </div>
    <div id="flash"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite } = Matter;
        const engine = Engine.create();
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: '#020617' }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        const walls = [
            Bodies.rectangle(window.innerWidth/2, window.innerHeight + 25, window.innerWidth, 50, { isStatic: true }),
            Bodies.rectangle(-25, window.innerHeight/2, 50, window.innerHeight, { isStatic: true }),
            Bodies.rectangle(window.innerWidth + 25, window.innerHeight/2, 50, window.innerHeight, { isStatic: true })
        ];
        Composite.add(engine.world, walls);

        function buy(color) {
            const f = document.getElementById('flash');
            f.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
            f.style.opacity = '1';
            
            setTimeout(() => {
                f.style.opacity = '0';
                const drop = Bodies.circle(window.innerWidth/2, window.innerHeight/2, 3, {
                    restitution: 0.5, render: { fillStyle: color }
                });
                Composite.add(engine.world, drop);
            }, 100);
        }

        window.addEventListener('deviceorientation', (e) => {
            engine.gravity.x = e.gamma / 20;
            engine.gravity.y = e.beta / 20;
        });

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        });
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
