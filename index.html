<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #F5F1E9; overflow: hidden; touch-action: none; font-family: -apple-system, system-ui, sans-serif; }
        .header { position: absolute; top: 50px; width: 100%; display: flex; justify-content: space-around; z-index: 100; }
        .btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; }
        .nickname {
            position: absolute; font-size: 16px; font-weight: 500;
            color: rgba(0, 0, 0, 0.3); transform: translateX(-50%);
            transition: all 4s cubic-bezier(0.1, 0, 0.2, 1); white-space: nowrap;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui-layer"></div>
    <div class="header">
        <div class="btn" style="background: #79addc;" onclick="buy('#79addc', 2.2)"></div>
        <div class="btn" style="background: #a3c586;" onclick="buy('#a3c586', 2.9)"></div>
        <div class="btn" style="background: #ffffff;" onclick="buy('#ffffff', 3.5)"></div>
        <div class="btn" style="background: #9b89b3;" onclick="buy('#9b89b3', 4.4)"></div>
    </div>
    <div id="liquid-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
        const engine = Engine.create();
        
        const W = window.innerWidth, H = window.innerHeight, T = 1000;
        let state = 'normal'; // 'normal', 'rising', 'floating', 'falling'

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: { width: W, height: H, wireframes: false, background: 'transparent' }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        const walls = [
            Bodies.rectangle(W/2, H + T/2 - 20, W * 2, T, { isStatic: true, friction: 0.1 }),
            Bodies.rectangle(-T/2, H/2, T, H * 2, { isStatic: true }),
            Bodies.rectangle(W + T/2, H/2, T, H * 2, { isStatic: true })
        ];
        // Потолок на 50% высоты
        const midCeiling = Bodies.rectangle(W/2, H * 0.5, W, 20, { isStatic: true, isSensor: true }); 
        
        Composite.add(engine.world, [...walls, midCeiling]);

        function buy(color, radius) {
            const drop = Bodies.circle(W/2, H/2, radius, {
                restitution: 0.1, frictionAir: 0.04,
                render: { fillStyle: color },
                label: 'falling'
            });
            Composite.add(engine.world, drop);
            if (window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        Events.on(engine, 'beforeUpdate', () => {
            if (state === 'rising') {
                engine.gravity.y = -0.15; // Медленный взлет
                midCeiling.isSensor = false;
            } else if (state === 'floating') {
                engine.gravity.y = 0; // Зависание (невесомость)
                midCeiling.isSensor = false;
            } else if (state === 'falling') {
                engine.gravity.y = 1.2; // Падение
                midCeiling.isSensor = true;
            } else {
                engine.gravity.y = 1.0; // Норма
                midCeiling.isSensor = true;
            }

            Composite.allBodies(engine.world).forEach(body => {
                if (!body.isStatic && body.label === 'falling') {
                    body.force.y = body.mass * 0.001;
                    body.force.x = 0;
                }
            });
        });

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                if (pair.bodyA.label === 'falling') pair.bodyA.label = 'liquid';
                if (pair.bodyB.label === 'falling') pair.bodyB.label = 'liquid';
            });
        });

        window.addEventListener('deviceorientation', (e) => {
            if (state === 'normal') {
                engine.gravity.x = (e.gamma || 0) / 50;
                engine.gravity.y = (e.beta || 0) / 50;
            }
        });

        let lastX = 0;
        window.addEventListener('devicemotion', (e) => {
            const acc = e.acceleration;
            if (!acc || state !== 'normal') return;
            if (Math.abs(acc.x - lastX) > 20) {
                startSequence();
            }
            lastX = acc.x;
        });

        function startSequence() {
            state = 'rising';
            showName();
            
            // Взлетаем 2 секунды до середины
            setTimeout(() => {
                state = 'floating';
                // Висим 5 секунд
                setTimeout(() => {
                    state = 'falling';
                    // Падаем 2 секунды до нормы
                    setTimeout(() => { state = 'normal'; }, 2000);
                }, 5000);
            }, 2000);
        }

        function showName() {
            const name = window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || "GUEST";
            const ui = document.getElementById('ui-layer');
            const el = document.createElement('div');
            el.className = 'nickname';
            el.innerText = name;
            el.style.left = '50%';
            el.style.top = '70%'; 
            ui.appendChild(el);
            
            setTimeout(() => { 
                el.style.top = '45%'; 
                el.style.opacity = '0'; 
            }, 50);
            setTimeout(() => el.remove(), 4000);
        }

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        }, {once: true});

        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
