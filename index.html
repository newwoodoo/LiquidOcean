<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        /* UI */
        .ui { position: absolute; z-index: 1000; width: 100%; pointer-events: none; }
        .bottom-bar { position: absolute; bottom: 0; width: 100%; height: 90px; background: linear-gradient(to top, #000 70%, transparent); display: flex; justify-content: center; align-items: center; gap: 6px; pointer-events: auto; }
        .btn { width: 42px; height: 42px; border-radius: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 10px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn.active-launch { background: #f1c40f; color: #000; box-shadow: 0 0 25px #f1c40f; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0% { scale: 1; } 50% { scale: 1.15; } 100% { scale: 1; } }

        /* Прицел */
        #aim-ui { position: absolute; width: 240px; height: 240px; border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); border: 2px solid rgba(241,196,15,0.2); z-index: 500; }
        .sector { position: absolute; width: 50%; height: 50%; left: 50%; top: 50%; transform-origin: 0 0; clip-path: polygon(0 0, 100% 0, 85% 35%, 0 0); }
        .sector.highlight { background: rgba(241,196,15,0.5); border-top: 3px solid #f1c40f; }

        /* Комета ГРАФИКА */
        .obj { position: absolute; transform-origin: center; pointer-events: none; }
        .comet-body { 
            width: 24px; height: 16px; background: #555; 
            border-radius: 45% 55% 35% 65% / 50% 40% 60% 50%; 
            box-shadow: inset -4px -4px 8px #000, 0 0 15px orange;
            position: relative; z-index: 10;
        }
        .comet-glow { position: absolute; width: 40px; height: 40px; background: radial-gradient(circle, rgba(255,165,0,0.4) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .comet-tail { 
            position: absolute; width: 12px; height: 120px; 
            background: linear-gradient(to bottom, orange, rgba(255,69,0,0.6), transparent); 
            filter: blur(6px); transform-origin: top center; top: 10px; left: 6px; 
        }

        @keyframes colorSpin { 0%{background:red} 25%{background:lime} 50%{background:blue} 75%{background:yellow} 100%{background:red} }
        .star-particle { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; box-shadow: 0 0 5px #fff; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="bottom-bar">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 25)">$25</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet', 50)" onclick="confirmComet()">☄️</div>
        <div class="btn" style="opacity:0.1">?</div><div class="btn" style="opacity:0.1">?</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events, Vector } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const aim = document.getElementById('aim-ui');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 1, offsetX = 0, offsetY = 0;
        let lastDist = 0, lastMid = {x:0, y:0};
        let activeDrag = null, isPanning = false, lastX = 0, lastY = 0;
        let cometPending = null;

        for(let i=0; i<16; i++) {
            let s = document.createElement('div'); s.className = 'sector';
            s.style.transform = `rotate(${i * 22.5 - 11.25}deg)`; aim.appendChild(s);
        }

        function initDrag(e, type, price) {
            const t = e.touches[0];
            activeDrag = { type, price, x: t.pageX, y: t.pageY, active: false };
            haptic('light');
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                lastMid = { x: (e.touches[0].pageX + e.touches[1].pageX)/2, y: (e.touches[0].pageY + e.touches[1].pageY)/2 };
            } else if (!e.target.closest('.btn')) {
                isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0];
                if (window.innerHeight - t.pageY > 100) {
                    if(!activeDrag.active) { activeDrag.active = true; haptic('medium'); }
                    activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                }
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t1.pageX - t2.pageX, t1.pageY - t2.pageY);
                const mid = { x: (t1.pageX + t2.pageX)/2, y: (t1.pageY + t2.pageY)/2 };
                
                const deltaScale = dist / lastDist;
                const nextScale = Math.min(Math.max(scale * deltaScale, 0.1), 20);
                
                // Математика зума в точку между пальцами
                offsetX -= (mid.x - offsetX) * (nextScale / scale - 1);
                offsetY -= (mid.y - offsetY) * (nextScale / scale - 1);
                
                scale = nextScale; lastDist = dist; lastMid = mid;
                updateTransform();
            } else if (isPanning) {
                offsetX += e.touches[0].pageX - lastX; offsetY += e.touches[0].pageY - lastY;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY; updateTransform();
            }
            
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                cometPending.angle = Math.round(Math.atan2(dy, dx) / (Math.PI/8)) * (Math.PI/8);
                updateSectors(cometPending.angle);
            }
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                const wx = (activeDrag.x - offsetX) / scale;
                const wy = (activeDrag.y - offsetY) / scale;
                if (activeDrag.type === 'star') placeStar(wx, wy, activeDrag.price);
                else prepareComet(wx, wy);
            }
            activeDrag = null; isPanning = false; lastDist = 0;
        });

        function updateSectors(angle) {
            const sectors = document.querySelectorAll('.sector');
            const index = (Math.round(angle / (Math.PI/8)) + 16) % 16;
            sectors.forEach((s, i) => s.classList.toggle('highlight', i === index));
        }

        function placeStar(x, y, p) {
            const b = Bodies.circle(x, y, 10, { isStatic: true, isSensor: true });
            b.price = p;
            const v = document.createElement('div'); v.className = 'obj';
            const s = p === 25 ? 12 : (p === 10 ? 8 : 4);
            v.innerHTML = `<div style="width:${s}px;height:${s}px;background:#fff;border-radius:50%;box-shadow:0 0 ${s*3}px #fff;"></div>`;
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function prepareComet(x, y) {
            cometPending = { wx: x, wy: y, angle: 0 };
            aim.style.display = 'block';
            updateTransform();
            document.getElementById('comet-btn').classList.add('active-launch');
        }

        function confirmComet() {
            if (!cometPending) return;
            const b = Bodies.circle(cometPending.wx, cometPending.wy, 12, { frictionAir: 0 });
            const v = document.createElement('div'); v.className = 'obj';
            v.innerHTML = `<div class="comet-tail"></div><div class="comet-glow"></div><div class="comet-body"></div>`;
            b.visual = v; b.isComet = true;
            Body.setVelocity(b, { x: Math.cos(cometPending.angle) * 0.06, y: Math.sin(cometPending.angle) * 0.06 });
            Composite.add(engine.world, b);
            aim.style.display = 'none';
            document.getElementById('comet-btn').classList.remove('active-launch');
            cometPending = null; haptic('heavy');
        }

        Events.on(engine, 'afterUpdate', () => {
            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px';
                    b.visual.style.top = b.position.y + 'px';
                    if(b.isComet) {
                        const angle = Math.atan2(b.velocity.y, b.velocity.x) + Math.PI/2;
                        b.visual.style.transform = `translate(-50%, -50%) rotate(${angle}rad) scale(${Math.max(1, scale/5)})`;
                        
                        bodies.forEach(star => {
                            if(!star.isComet && star.price <= 3 && Vector.magnitude(Vector.sub(b.position, star.position)) < 25) {
                                createExplosion(star.position.x, star.position.y);
                                Composite.remove(engine.world, star); star.visual.remove(); haptic('medium');
                            }
                        });
                    }
                }
            });
        });

        function createExplosion(x, y) {
            for(let i=0; i<12; i++) {
                const p = document.createElement('div'); p.className = 'star-particle';
                p.style.left = x+'px'; p.style.top = y+'px'; view.appendChild(p);
                const ang = Math.random()*Math.PI*2; const dist = 30+Math.random()*30;
                p.animate([{ transform: `translate(0,0)`, opacity: 1 }, { transform: `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`, opacity: 0 }], 1000);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function updateTransform() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            if(cometPending) {
                aim.style.left = (cometPending.wx * scale + offsetX) + 'px';
                aim.style.top = (cometPending.wy * scale + offsetY) + 'px';
            }
        }

        function haptic(s) { if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred(s); }
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>

</body>
