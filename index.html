<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #F5F1E9; overflow: hidden; touch-action: none; font-family: -apple-system, system-ui, sans-serif; }
        .header { position: absolute; top: 50px; width: 100%; display: flex; justify-content: space-around; z-index: 100; }
        .btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; }
        .nickname {
            position: absolute; font-size: 16px; font-weight: 500;
            color: rgba(0, 0, 0, 0.3); transform: translateX(-50%);
            transition: all 4s cubic-bezier(0.1, 0, 0.2, 1); white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="ui-layer"></div>
    <div class="header">
        <div class="btn" style="background: #79addc;" onclick="buy('#79addc', 2.2)"></div>
        <div class="btn" style="background: #a3c586;" onclick="buy('#a3c586', 2.9)"></div>
        <div class="btn" style="background: #ffffff;" onclick="buy('#ffffff', 3.5)"></div>
        <div class="btn" style="background: #9b89b3;" onclick="buy('#9b89b3', 4.4)"></div>
    </div>
    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
        const engine = Engine.create();
        const W = window.innerWidth, H = window.innerHeight, T = 1000;
        let state = 'normal'; 

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: { width: W, height: H, wireframes: false, background: 'transparent' }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        const walls = [
            Bodies.rectangle(W/2, H + T/2 - 20, W * 2, T, { isStatic: true, friction: 0.1 }),
            Bodies.rectangle(-T/2, H/2, T, H * 2, { isStatic: true }),
            Bodies.rectangle(W + T/2, H/2, T, H * 2, { isStatic: true })
        ];
        Composite.add(engine.world, walls);

        // Лимит высоты: 30% от верха экрана (пройдут 70% высоты)
        const limitY = H * 0.3; 

        function buy(color, radius) {
            const drop = Bodies.circle(W/2, H/2, radius, {
                restitution: 0.1, frictionAir: 0.05,
                render: { fillStyle: color }, label: 'liquid'
            });
            Composite.add(engine.world, drop);
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        Events.on(engine, 'beforeUpdate', () => {
            const bodies = Composite.allBodies(engine.world);
            
            if (state === 'rising' || state === 'floating') {
                // Игнорируем гироскоп полностью: X = 0
                engine.gravity.x = 0;
                engine.gravity.y = state === 'rising' ? -0.12 : 0; 
                
                bodies.forEach(body => {
                    if (!body.isStatic) {
                        // Если частица долетела до верхней границы
                        if (body.position.y <= limitY) {
                            Body.setPosition(body, { x: body.position.x, y: limitY });
                            // Обнуляем вертикальную скорость, чтобы не "скакали"
                            Body.setVelocity(body, { x: body.velocity.x * 0.9, y: 0 });
                        }
                    }
                });
            } else if (state === 'falling') {
                engine.gravity.y = 1.4;
            } else {
                engine.gravity.y = 1.0;
            }
        });

        window.addEventListener('deviceorientation', (e) => {
            // Применяем наклон только в обычном состоянии
            if (state === 'normal') {
                engine.gravity.x = (e.gamma || 0) / 45;
                engine.gravity.y = (e.beta || 0) / 45;
            }
        });

        window.addEventListener('devicemotion', (e) => {
            const acc = e.acceleration;
            if (!acc || state !== 'normal') return;
            if (Math.abs(acc.x) + Math.abs(acc.y) > 25) startSequence();
        });

        function startSequence() {
            state = 'rising';
            showName();
            setTimeout(() => { 
                state = 'floating';
                setTimeout(() => { 
                    state = 'falling';
                    setTimeout(() => { state = 'normal'; }, 1500);
                }, 5000);
            }, 3500); // Даем больше времени на подъем
        }

        function showName() {
            const name = window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || "USER";
            const ui = document.getElementById('ui-layer');
            const el = document.createElement('div');
            el.className = 'nickname';
            el.innerText = name;
            el.style.left = '50%';
            el.style.top = '80%'; 
            ui.appendChild(el);
            setTimeout(() => { 
                el.style.top = (limitY + 50) + 'px'; 
                el.style.opacity = '0'; 
            }, 50);
            setTimeout(() => el.remove(), 4500);
        }

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        }, {once: true});
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
