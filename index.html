<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #F5F1E9; /* Глубокий кремовый */
            overflow: hidden; touch-action: none;
        }
        
        /* Плоские кнопки с тонкими границами */
        .header { 
            position: absolute; top: 50px; width: 100%; 
            display: flex; justify-content: space-around; z-index: 100; 
        }

        .btn { 
            width: 36px; height: 36px; border-radius: 50%; 
            border: 1px solid rgba(0,0,0,0.1); cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.9); }

        /* Эффект появления - просто расширяющийся круг без свечения */
        #flash { 
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            width: 1px; height: 1px; border-radius: 50%; 
            border: 1px solid rgba(0,0,0,0);
            opacity: 0; pointer-events: none; z-index: 50;
        }

        #liquid-container { 
            width: 100vw; height: 100vh; 
            background: transparent;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="btn" style="background: #79addc;" onclick="buy('#79addc', 2.2)"></div> <div class="btn" style="background: #a3c586;" onclick="buy('#a3c586', 2.9)"></div> <div class="btn" style="background: #ffffff;" onclick="buy('#ffffff', 3.5)"></div> <div class="btn" style="background: #9b89b3;" onclick="buy('#9b89b3', 4.4)"></div> </div>
    
    <div id="flash"></div>
    <div id="liquid-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite } = Matter;
        const engine = Engine.create();
        
        // Физика стала еще более точной
        engine.positionIterations = 15;
        engine.timing.timeScale = 0.5;

        const render = Render.create({
            element: document.getElementById('liquid-container'),
            engine: engine,
            options: { 
                width: window.innerWidth, 
                height: window.innerHeight, 
                wireframes: false, 
                background: 'transparent',
                pixelRatio: window.devicePixelRatio // Для идеальной четкости на Retina-экранах
            }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        const T = 1000;
        const W = window.innerWidth;
        const H = window.innerHeight;
        const safeArea = 15;

        const walls = [
            Bodies.rectangle(W/2, H + T/2 - safeArea, W * 2, T, { isStatic: true, friction: 0.1 }),
            Bodies.rectangle(-T/2, H/2, T, H * 2, { isStatic: true, friction: 0.1 }),
            Bodies.rectangle(W + T/2, H/2, T, H * 2, { isStatic: true, friction: 0.1 })
        ];
        Composite.add(engine.world, walls);

        function buy(color, radius) {
            const f = document.getElementById('flash');
            
            // Анимация расширяющегося кольца (Ripple effect)
            f.style.transition = 'none';
            f.style.width = '0px';
            f.style.height = '0px';
            f.style.border = `1px solid ${color}`;
            f.style.opacity = '0.5';
            
            setTimeout(() => {
                f.style.transition = 'all 0.6s ease-out';
                f.style.width = '80px';
                f.style.height = '80px';
                f.style.opacity = '0';
                
                const drop = Bodies.circle(W/2, H/2, radius, {
                    restitution: 0.05,
                    frictionAir: 0.06,
                    render: { fillStyle: color }
                });
                
                Composite.add(engine.world, drop);
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
            }, 10);
        }

        window.addEventListener('deviceorientation', (e) => {
            // Исправленная логика наклона без рывков
            let x = e.gamma || 0;
            let y = e.beta || 0;
            engine.gravity.x = Math.max(Math.min(x / 45, 1.2), -1.2);
            engine.gravity.y = Math.max(Math.min(y / 45, 1.2), -1.2);
        });

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(()=>{});
            }
        }, {once: true});

        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
