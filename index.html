<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #020617; overflow: hidden; touch-action: none; }
        .header { position: absolute; top: 40px; width: 100%; display: flex; justify-content: space-around; z-index: 100; }
        .btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; }
        
        #flash { 
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            width: 70px; height: 70px; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 50;
        }

        /* Контейнер для эффекта жидкости */
        #liquid-container {
            width: 100vw;
            height: 100vh;
            filter: blur(2px) contrast(10); /* Слипание частиц в воду */
            background: #020617;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="btn" style="background:#3b82f6" onclick="buy('#3b82f6')"></div>
        <div class="btn" style="background:#22c55e" onclick="buy('#22c55e')"></div>
        <div class="btn" style="background:#ffffff" onclick="buy('#ffffff')"></div>
        <div class="btn" style="background:#a855f7" onclick="buy('#a855f7')"></div>
    </div>
    <div id="flash"></div>
    <div id="liquid-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite } = Matter;
        const engine = Engine.create();
        
        // Замедляем мир в 3 раза для эффекта воды
        engine.timing.timeScale = 0.35;

        const render = Render.create({
            element: document.getElementById('liquid-container'),
            engine: engine,
            options: { 
                width: window.innerWidth, 
                height: window.innerHeight, 
                wireframes: false, 
                background: 'transparent' 
            }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        // Создаем максимально надежные границы
        const thickness = 500; 
        const walls = [
            // Пол
            Bodies.rectangle(window.innerWidth/2, window.innerHeight + thickness/2 - 2, window.innerWidth * 2, thickness, { isStatic: true }),
            // Лево
            Bodies.rectangle(-thickness/2 + 2, window.innerHeight/2, thickness, window.innerHeight * 2, { isStatic: true }),
            // Право
            Bodies.rectangle(window.innerWidth + thickness/2 - 2, window.innerHeight/2, thickness, window.innerHeight * 2, { isStatic: true })
        ];
        Composite.add(engine.world, walls);

        function buy(color) {
            const f = document.getElementById('flash');
            f.style.background = `radial-gradient(circle, ${color} 0%, transparent 75%)`;
            f.style.transition = 'none';
            f.style.opacity = '1';
            
            setTimeout(() => {
                f.style.transition = 'opacity 0.8s ease-out';
                f.style.opacity = '0';
                
                // Создаем частицу-пиксель
                const drop = Bodies.circle(window.innerWidth/2, window.innerHeight/2 - 10, 3.5, {
                    restitution: 0.05,
                    friction: 0.001,
                    frictionAir: 0.1, // Большое сопротивление воздуха для медленного падения
                    render: { fillStyle: color }
                });
                
                Composite.add(engine.world, drop);
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
            }, 50);
        }

        // Мягкий гироскоп
        window.addEventListener('deviceorientation', (e) => {
            // Очень плавное движение при наклоне
            engine.gravity.x = (e.gamma || 0) / 80;
            engine.gravity.y = (e.beta || 0) / 80;
        });

        document.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(() => {});
            }
        }, {once: true});

        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
