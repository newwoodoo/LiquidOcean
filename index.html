<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Ocean</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020617;
            font-family: sans-serif;
        }

        .shop-header {
            position: absolute;
            top: 40px;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            z-index: 100;
        }

        .drop-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .b-blue { background: #3b82f6; }
        .b-green { background: #22c55e; }
        .b-white { background: #ffffff; }
        .b-purple { background: #a855f7; }

        #flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
        }

        canvas {
            display: block;
            /* Пока отключил фильтр, чтобы увидеть точки */
            /* filter: blur(4px) contrast(15); */
        }
    </style>
</head>
<body>

    <div class="shop-header">
        <div class="drop-btn b-blue" onclick="purchase('#3b82f6')"></div>
        <div class="drop-btn b-green" onclick="purchase('#22c55e')"></div>
        <div class="drop-btn b-white" onclick="purchase('#ffffff')"></div>
        <div class="drop-btn b-purple" onclick="purchase('#a855f7')"></div>
    </div>

    <div id="flash"></div>

    <script>
        // Проверка загрузки Matter.js
        if (typeof Matter === 'undefined') {
            alert('Библиотека физики не загружена. Проверь интернет.');
        }

        const { Engine, Render, Runner, Bodies, Composite } = Matter;

        const engine = Engine.create();
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#020617'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Стенки
        const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight + 25, window.innerWidth, 50, { isStatic: true });
        const leftWall = Bodies.rectangle(-25, window.innerHeight/2, 50, window.innerHeight, { isStatic: true });
        const rightWall = Bodies.rectangle(window.innerWidth + 25, window.innerHeight/2, 50, window.innerHeight, { isStatic: true });
        Composite.add(engine.world, [ground, leftWall, rightWall]);

        function purchase(color) {
            // Вспышка
            const flash = document.getElementById('flash');
            flash.style.background = `radial-gradient(circle, ${color} 0%, rgba(0,0,0,0) 80%)`;
            flash.style.opacity = '1';
            flash.style.transition = 'none';

            // Вибрация
            if (window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }

            setTimeout(() => {
                flash.style.transition = 'opacity 0.5s ease-out';
                flash.style.opacity = '0';

                // Создаем каплю
                const drop = Bodies.circle(
                    window.innerWidth / 2,
                    window.innerHeight / 2,
                    4, // Размер чуть больше для теста
                    {
                        restitution: 0.5,
                        friction: 0.02,
                        render: { fillStyle: color }
                    }
                );
                Composite.add(engine.world, drop);
            }, 50);
        }

        // Гироскоп
        window.addEventListener('deviceorientation', (e) => {
            engine.gravity.x = e.gamma / 20;
            engine.gravity.y = e.beta / 20;
        });

        // Запрос разрешений для iPhone
        document.body.addEventListener('touchstart', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        }, { once: true });

        Telegram.WebApp.ready();
    </script>
</body>
</html>
