<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10000; }
        #zoom-bar { width: 100px; height: 6px; background: rgba(255,255,255,0.1); margin-bottom: 8px; border-radius: 3px; position: relative; border: 1px solid #333; }
        #zoom-indicator { position: absolute; height: 100%; background: #f1c40f; left: 50%; width: 0%; transform: translateX(-50%); }
        
        #minimap { width: 90px; height: 90px; background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 4px; position: relative; overflow: hidden; }
        #minimap-point { position: absolute; width: 6px; height: 6px; background: #ff0; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #ff0; }

        .ui-panel { position: absolute; bottom: 0; width: 100%; height: 100px; background: #111; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10001; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
        .btn { width: 55px; height: 55px; border-radius: 15px; background: #222; border: 1px solid #444; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

        .obj { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; }
        
        /* Звезда $3: 4 типа лучей */
        .ray-3 { position: absolute; top: 50%; left: 50%; width: 2px; background: linear-gradient(to top, #fff, transparent); transform-origin: 50% 100%; }
        .r-short { animation: blink 1s infinite alternate; }
        .r-med { animation: blink 1.5s infinite alternate-reverse; }
        .r-long { animation: blink 2s infinite alternate; }
        .r-fast { animation: blink 0.5s infinite; }
        @keyframes blink { from { opacity: 0.1; height: 10px; } to { opacity: 0.8; height: 45px; } }

        /* Звезда $10: Пояс астероидов */
        .belt { position: absolute; top: 50%; left: 50%; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; transform: translate(-50%, -50%) rotateX(70deg); animation: rotateBelt 10s linear infinite; }
        @keyframes rotateBelt { from { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg); } to { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg); } }
        .asteroid { position: absolute; width: 4px; height: 4px; background: #aaa; border-radius: 50%; }

        /* Комета */
        .comet-v { position: absolute; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px #00d4ff; }
        .comet-tail { position: absolute; top: 0; left: 50%; width: 20px; height: 100px; background: linear-gradient(to bottom, #00d4ff, transparent); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); transform: translateX(-50%); opacity: 0.5; }

        #aim-ui { position: absolute; width: 160px; height: 160px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 5000; }
    </style>
</head>
<body>
    <div id="ui-container">
        <div id="zoom-bar"><div id="zoom-indicator"></div></div>
        <div id="minimap" onclick="teleport(event)"><div id="minimap-point"></div></div>
    </div>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="ui-panel">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet')">☄️</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        const WORLD_SIZE = 15000;
        let scale = 0.2, offsetX = window.innerWidth/2, offsetY = window.innerHeight/2;
        let lastDist = 0, activeDrag = null, isPanning = false, lastX = 0, lastY = 0;

        function teleport(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            offsetX = window.innerWidth/2 - ((e.clientX - rect.left)/rect.width - 0.5) * WORLD_SIZE * scale;
            offsetY = window.innerHeight/2 - ((e.clientY - rect.top)/rect.height - 0.5) * WORLD_SIZE * scale;
            updateTransform();
        }

        function initDrag(e, type, price) {
            e.stopPropagation();
            activeDrag = { type, price, x: e.touches[0].pageX, y: e.touches[0].pageY, active: false };
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            else if (!e.target.closest('.ui-panel')) { isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY; }
        });

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0]; activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                if (window.innerHeight - t.pageY > 120) activeDrag.active = true;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const midX = (e.touches[0].pageX + e.touches[1].pageX) / 2, midY = (e.touches[0].pageY + e.touches[1].pageY) / 2;
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), 0.05), 0.5);
                offsetX = midX - (midX - offsetX) * (nextScale / scale);
                offsetY = midY - (midY - offsetY) * (nextScale / scale);
                scale = nextScale; lastDist = dist;
                updateTransform();
            } else if (isPanning) {
                offsetX += (e.touches[0].pageX - lastX) * 0.5; // Скорректированная скорость
                offsetY += (e.touches[0].pageY - lastY) * 0.5;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                updateTransform();
            }
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                const wx = (activeDrag.x - offsetX) / scale;
                const wy = (activeDrag.y - offsetY) / scale;
                if (activeDrag.type === 'star') placeStar(wx, wy, activeDrag.price);
                else launchComet(wx, wy);
            }
            activeDrag = null; isPanning = false;
        });

        function placeStar(x, y, p) {
            const size = p === 1 ? 15 : (p === 3 ? 25 : 50);
            const b = Bodies.circle(x, y, size/2, { isStatic: true, label: 'star' });
            const v = document.createElement('div'); v.className = 'obj';
            v.style.width = size+'px'; v.style.height = size+'px';
            v.style.background = '#fff'; v.style.boxShadow = `0 0 ${size/2}px #fff`;

            if (p === 3) {
                const types = ['r-short', 'r-med', 'r-long', 'r-fast'];
                for(let i=0; i<12; i++) {
                    let r = document.createElement('div');
                    r.className = 'ray-3 ' + types[i % 4];
                    r.style.transform = `translate(-50%, -100%) rotate(${i*30}deg)`;
                    v.appendChild(r);
                }
            }
            if (p === 10) {
                let belt = document.createElement('div'); belt.className = 'belt';
                belt.style.width = size*2.5+'px'; belt.style.height = size*2.5+'px';
                for(let i=0; i<12; i++) {
                    let a = document.createElement('div'); a.className = 'asteroid';
                    a.style.left = 50 + 50*Math.cos(i) + '%'; a.style.top = 50 + 50*Math.sin(i) + '%';
                    belt.appendChild(a);
                }
                v.appendChild(belt);
            }
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function launchComet(x, y) {
            const b = Bodies.circle(x, y, 6, { frictionAir: 0, restitution: 1, label: 'comet' });
            const v = document.createElement('div'); v.className = 'comet-v';
            v.innerHTML = '<div class="comet-tail"></div>';
            b.visual = v; view.appendChild(v);
            Body.setVelocity(b, { x: 0.05, y: 0.05 }); // Оптимально медленно
            Composite.add(engine.world, b);
        }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px';
                    if (b.label === 'comet') {
                        const rot = Math.atan2(b.velocity.y, b.velocity.x) + Math.PI/2;
                        b.visual.style.transform = `translate(-50%, -50%) rotate(${rot}rad)`;
                    }
                }
            });
        });

        function updateTransform() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            const zPct = ((scale - 0.05) / 0.45) * 100;
            document.getElementById('zoom-indicator').style.width = zPct + '%';
            let mX = 50 - (offsetX - window.innerWidth/2) / (WORLD_SIZE * scale) * 100;
            let mY = 50 - (offsetY - window.innerHeight/2) / (WORLD_SIZE * scale) * 100;
            document.getElementById('minimap-point').style.left = Math.max(0, Math.min(100, mX)) + '%';
            document.getElementById('minimap-point').style.top = Math.max(0, Math.min(100, mY)) + '%';
        }

        updateTransform();
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
