<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: radial-gradient(circle at center, #0a0e17 0%, #000000 100%); overflow: hidden; touch-action: none; font-family: sans-serif; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        
        /* Панель управления */
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 200; }
        .btns { display: flex; gap: 10px; pointer-events: auto; }
        .btn { 
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        
        /* Переключатель и Зум */
        .top-nav { position: absolute; top: 50px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: auto; z-index: 200; }
        .toggle-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid white; padding: 8px 15px; border-radius: 20px; font-size: 12px; }
        .zoom-slider { width: 100px; accent-color: #f1c40f; }
        
        .star-label { position: absolute; color: white; font-size: 10px; text-shadow: 0 0 5px #fff; white-space: nowrap; pointer-events: none; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="ui-layer"></div>
    <div class="top-nav">
        <button class="toggle-btn" onclick="toggleView()">ВСЕ ЗВЕЗДЫ</button>
        <input type="range" class="zoom-slider" min="0.5" max="2" step="0.1" value="1" oninput="updateZoom(this.value)">
    </div>
    <div class="controls">
        <div class="btns">
            <div class="btn" style="background: #3498db;" onclick="addStar('#3498db', 3, 1)">$1</div>
            <div class="btn" style="background: #2ecc71;" onclick="addStar('#2ecc71', 4, 3)">$3</div>
            <div class="btn" style="background: #ffffff; color:#000" onclick="addStar('#ffffff', 6, 10)">$10</div>
            <div class="btn" style="background: #9b59b6;" onclick="addStar('#9b59b6', 8, 25)">$25</div>
            <div class="btn" style="background: linear-gradient(45deg, #f1c40f, #e67e22);" onclick="launchComet()">$50</div>
        </div>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create();
        engine.gravity.y = 0; // В космосе нет гравитации вниз
        
        const W = window.innerWidth, H = window.innerHeight;
        const render = Render.create({
            element: document.body, engine: engine,
            options: { width: W, height: H, wireframes: false, background: 'transparent' }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        let myStarsOnly = false;
        let zoom = 1;

        function addStar(color, radius, price) {
            let name = "";
            if (price >= 10) {
                name = prompt("Дайте имя вашей звезде:", "Сириус") || "";
            }

            const star = Bodies.circle(W/2 + (Math.random()-0.5)*100, H/2 + (Math.random()-0.5)*100, radius, {
                restitution: 0.9, frictionAir: 0.01,
                render: { 
                    fillStyle: color,
                    shadowBlur: radius * 2,
                    shadowColor: color
                }
            });
            star.isMine = true;
            star.starName = name;
            star.originalColor = color;
            Composite.add(engine.world, star);
            
            if (name) createLabel(star);
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        }

        function launchComet() {
            const comet = Bodies.circle(-50, H * 0.2, 5, {
                render: { fillStyle: '#fff', shadowBlur: 20, shadowColor: '#f1c40f' }
            });
            Body.setVelocity(comet, { x: 15, y: 2 });
            comet.isComet = true;
            comet.isMine = true;
            Composite.add(engine.world, comet);
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }

        function createLabel(body) {
            const el = document.createElement('div');
            el.className = 'star-label';
            el.innerText = body.starName;
            document.getElementById('ui-layer').appendChild(el);
            body.labelEl = el;
        }

        function toggleView() {
            myStarsOnly = !myStarsOnly;
            document.querySelector('.toggle-btn').innerText = myStarsOnly ? "ТОЛЬКО МОИ" : "ВСЕ ЗВЕЗДЫ";
            Composite.allBodies(engine.world).forEach(body => {
                if (!body.isMine) {
                    body.render.opacity = myStarsOnly ? 0.1 : 1;
                }
            });
        }

        function updateZoom(val) {
            zoom = val;
            render.canvas.style.transform = `scale(${val})`;
        }

        Events.on(engine, 'afterUpdate', () => {
            Composite.allBodies(engine.world).forEach(body => {
                if (body.labelEl) {
                    body.labelEl.style.left = (W/2 + (body.position.x - W/2) * zoom) + 'px';
                    body.labelEl.style.top = (H/2 + (body.position.y - H/2) * zoom - 15) + 'px';
                }
                // Кометы улетают за экран
                if (body.isComet && body.position.x > W + 100) Composite.remove(engine.world, body);
            });
        });

        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
