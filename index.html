<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #010208; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        .bottom-bar { position: absolute; bottom: 0; width: 100%; height: 90px; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; gap: 8px; pointer-events: auto; z-index: 2000; }
        .btn { width: 45px; height: 45px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .btn.active-launch { background: #f1c40f; color: #000; box-shadow: 0 0 20px #f1c40f; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Сектора прицела */
        #aim-ui { position: absolute; width: 220px; height: 220px; border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 500; }
        .sector { position: absolute; width: 50%; height: 50%; left: 50%; top: 50%; transform-origin: 0 0; clip-path: polygon(0 0, 100% 0, 85% 35%, 0 0); border-top: 1px solid rgba(255,255,255,0.15); }
        .sector.highlight { background: rgba(241,196,15,0.6); border-top: 2px solid #f1c40f; box-shadow: 0 0 15px #f1c40f; }

        /* ГРАФИКА ОБЪЕКТОВ */
        .obj { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
        
        /* Комета */
        .comet-visual { width: 30px; height: 20px; position: relative; }
        .comet-body { width: 100%; height: 100%; background: #666; border-radius: 40% 60% 40% 50%; box-shadow: inset -5px -5px 10px #000, 0 0 15px orange; position: relative; z-index: 5; }
        .comet-fire { position: absolute; width: 50px; height: 150px; background: linear-gradient(to bottom, #ffae00, #ff4d00, transparent); filter: blur(8px); top: 10px; left: -10px; transform-origin: top center; opacity: 0.8; }
        .comet-core { position: absolute; width: 10px; height: 10px; background: #fff; border-radius: 50%; top: 5px; left: 10px; box-shadow: 0 0 20px #fff; z-index: 6; }

        /* Звезда $3 с лучами */
        .star-3-ray { position: absolute; top: 50%; left: 50%; height: 1px; width: 20px; transform-origin: left center; animation: colorShift 3s infinite linear; }
        @keyframes colorShift { 0% { background: red; } 25% { background: lime; } 50% { background: blue; } 75% { background: yellow; } 100% { background: red; } }

        .explosion-p { position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="aim-ui"></div>

    <div class="bottom-bar">
        <div class="btn" ontouchstart="initDrag(event, 'star', 1)">$1</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 3)">$3</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 10)">$10</div>
        <div class="btn" ontouchstart="initDrag(event, 'star', 25)">$25</div>
        <div id="comet-btn" class="btn" ontouchstart="initDrag(event, 'comet', 50)" onclick="confirmComet()">☄️</div>
        <div class="btn" style="opacity:0.1">?</div><div class="btn" style="opacity:0.1">?</div>
    </div>

    <script>
        const { Engine, Runner, Bodies, Composite, Body, Events, Vector } = Matter;
        const engine = Engine.create(); engine.gravity.y = 0;
        const view = document.getElementById('viewport');
        const runner = Runner.create(); Runner.run(runner, engine);

        let scale = 1, offsetX = 0, offsetY = 0, lastDist = 0;
        let activeDrag = null, isPanning = false, lastX = 0, lastY = 0;
        let cometPending = null;

        // Создаем сектора
        for(let i=0; i<16; i++) {
            let s = document.createElement('div'); s.className = 'sector';
            s.style.transform = `rotate(${i * 22.5 - 11.25}deg)`;
            document.getElementById('aim-ui').appendChild(s);
        }

        function initDrag(e, type, price) {
            const t = e.touches[0];
            activeDrag = { type, price, x: t.pageX, y: t.pageY, active: false };
            haptic('light');
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (!e.target.closest('.btn')) {
                isPanning = true; lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                const t = e.touches[0];
                if (window.innerHeight - t.pageY > 110) {
                    if(!activeDrag.active) { activeDrag.active = true; haptic('medium'); }
                    activeDrag.x = t.pageX; activeDrag.y = t.pageY;
                }
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t1.pageX - t2.pageX, t1.pageY - t2.pageY);
                const mid = { x: (t1.pageX + t2.pageX)/2, y: (t1.pageY + t2.pageY)/2 };
                const nextScale = Math.min(Math.max(scale * (dist / lastDist), 0.1), 30);
                offsetX -= (mid.x - offsetX) * (nextScale / scale - 1);
                offsetY -= (mid.y - offsetY) * (nextScale / scale - 1);
                scale = nextScale; lastDist = dist; updateTransform();
            } else if (isPanning) {
                offsetX += e.touches[0].pageX - lastX; offsetY += e.touches[0].pageY - lastY;
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY; updateTransform();
            }
            
            if (cometPending) {
                const dx = e.touches[0].pageX - (cometPending.wx * scale + offsetX);
                const dy = e.touches[0].pageY - (cometPending.wy * scale + offsetY);
                cometPending.angle = Math.round(Math.atan2(dy, dx) / (Math.PI/8)) * (Math.PI/8);
                updateSectors(cometPending.angle);
            }
        });

        window.addEventListener('touchend', () => {
            if (activeDrag && activeDrag.active) {
                const wx = (activeDrag.x - offsetX) / scale;
                const wy = (activeDrag.y - offsetY) / scale;
                if (activeDrag.type === 'star') placeStar(wx, wy, activeDrag.price);
                else prepareComet(wx, wy);
            }
            activeDrag = null; isPanning = false; lastDist = 0;
        });

        function placeStar(x, y, p) {
            const b = Bodies.circle(x, y, 12, { isStatic: true, isSensor: true });
            b.price = p;
            const v = document.createElement('div'); v.className = 'obj';
            if (p === 3) {
                for(let i=0; i<6; i++) {
                    let r = document.createElement('div'); r.className = 'star-3-ray';
                    r.style.transform = `rotate(${i*60}deg)`; v.appendChild(r);
                }
            }
            const s = p === 25 ? 14 : (p === 10 ? 8 : 5);
            v.innerHTML += `<div style="width:${s}px;height:${s}px;background:#fff;border-radius:50%;box-shadow:0 0 ${s*4}px #fff;"></div>`;
            b.visual = v; view.appendChild(v); Composite.add(engine.world, b);
        }

        function prepareComet(x, y) {
            cometPending = { wx: x, wy: y, angle: 0 };
            document.getElementById('aim-ui').style.display = 'block';
            document.getElementById('comet-btn').classList.add('active-launch');
            updateTransform();
        }

        function confirmComet() {
            if (!cometPending) return;
            const b = Bodies.circle(cometPending.wx, cometPending.wy, 15, { frictionAir: 0 });
            b.isComet = true;
            const v = document.createElement('div'); v.className = 'obj';
            v.innerHTML = `<div class="comet-visual"><div class="comet-fire"></div><div class="comet-body"></div><div class="comet-core"></div></div>`;
            b.visual = v;
            Body.setVelocity(b, { x: Math.cos(cometPending.angle) * 0.07, y: Math.sin(cometPending.angle) * 0.07 });
            Composite.add(engine.world, b);
            document.getElementById('aim-ui').style.display = 'none';
            document.getElementById('comet-btn').classList.remove('active-launch');
            cometPending = null;
        }

        function updateSectors(angle) {
            const index = (Math.round(angle / (Math.PI/8)) + 16) % 16;
            document.querySelectorAll('.sector').forEach((s, i) => s.classList.toggle('highlight', i === index));
        }

        Events.on(engine, 'afterUpdate', () => {
            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(b => {
                if (b.visual) {
                    b.visual.style.left = b.position.x + 'px'; b.visual.style.top = b.position.y + 'px';
                    if(b.isComet) {
                        const rot = Math.atan2(b.velocity.y, b.velocity.x) + Math.PI/2;
                        b.visual.style.transform = `translate(-50%, -50%) rotate(${rot}rad) scale(${Math.max(1, scale/4)})`;
                        bodies.forEach(s => {
                            if(!s.isComet && s.price <= 3 && Vector.magnitude(Vector.sub(b.position, s.position)) < 30) {
                                createExp(s.position.x, s.position.y); Composite.remove(engine.world, s); s.visual.remove();
                            }
                        });
                    }
                }
            });
        });

        function createExp(x, y) {
            for(let i=0; i<15; i++) {
                const p = document.createElement('div'); p.className = 'explosion-p';
                p.style.left = x+'px'; p.style.top = y+'px'; view.appendChild(p);
                const a = Math.random()*Math.PI*2; const d = 40+Math.random()*40;
                p.animate([{transform:'scale(1)', opacity:1}, {transform:`translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px) scale(0)`, opacity:0}], 1000);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function updateTransform() {
            view.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            if(cometPending) {
                const aim = document.getElementById('aim-ui');
                aim.style.left = (cometPending.wx * scale + offsetX) + 'px';
                aim.style.top = (cometPending.wy * scale + offsetY) + 'px';
            }
        }

        function haptic(s) { if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred(s); }
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
